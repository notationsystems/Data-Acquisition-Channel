# ----------------------------------------------------------------------
# THE FINDING THAT SURVIVED, and it is about the core rather than the map.
# ----------------------------------------------------------------------
the_core_has_moved_six_commits_and_the_version_did_not:
  instance_of: the_immutable_referent_was_recorded_and_the_mutable_one_was_joined_on
  measured:
    pinned_here: 5e146d5
    remote_branch_head: e02cd66
    commits_between: 6
    is_the_pin_an_ancestor_of_the_head: true
    version_at_the_pin: "1.0.0"
    version_at_the_head: "1.0.0"
  why_this_is_the_predicted_case_and_not_a_new_one: "architecture/core.yaml wrote the failure mode down before it happened, in these words: `THE FAILURE THAT MAKES THIS URGENT is not a version bump, which is loud -- it is a submodule bumped to a commit whose pyproject still says 1.0.0. Patch commits do not bump versions. Every check passes, the recorded commit is silently wrong, and every `extends` still agrees.` Six commits landed and the version did not move. The condition that prediction names is live on the remote."
  what_is_NOT_wrong_right_now: "the pin has not moved, so nothing here is stale and no claim in this repository is currently relative to the wrong object. The core_referent join holds: core.yaml's submodule_commit equals the gitlink. This is a prediction confirmed about the REMOTE, not a defect found in the tree."
  and_what_is_waiting_at_the_head: "architecture/exchange/ste_invariant_declaration.yaml, authored by the core as owner. That is the artifact this pair asked for and recorded as unanswerable -- build_ste_invariants.py names that exact path as what would supersede its reconstruction, and ste_invariants.yaml carries `RECONSTRUCTION_NOT_DECLARATION` and a warning never to cite it as the core's own statement. The declaration exists. It answers all three asks in order, and it disagrees with the reconstruction on the cardinality: NEITHER eight nor ten."
  why_the_pin_is_not_bumped_in_this_commit: "bumping it re-points every `bent: zero`, every `core_invariants_modified: 0` and every `extends:` at a different object, and core.yaml's own rule says those must then be RE-MEASURED rather than carried. That is a phase of work with a preregistration, not a line in a register. What this file owes is the measurement, and here it is."

# ----------------------------------------------------------------------
the_instrument_that_manufactured_a_finding:
  what_the_draft_claimed: "the three core commits `share no objects` -- established by running `git cat-file -e <commit>` for each inside ste-clean and observing all of them fail."
  what_is_actually_true: "all three are one history. acdde14 is an ancestor of 5e146d5, which is an ancestor of the remote head."
  the_mechanism: "ste-clean is a PARTIAL CLONE (remote.origin.promisor true, partialclonefilter blob:none). In a partial clone, asking whether an object is present is not a read: on a miss, git fetches it from the promisor remote and answers yes. Re-running the same query with the full SHA returned `commit` for all three, and two new promisor packs appeared in .git/objects/pack timestamped inside the same minute -- the objects arrived because they were asked about."
  why_the_first_run_said_no_and_the_second_said_yes: "the first used ABBREVIATED shas. Abbreviation must be resolved against the local object database before a fetch can be attempted, so a short sha misses locally and never triggers the lazy path. The full sha goes straight to the promisor. The difference between the two runs was seven characters, and it inverted the finding."
  the_general_form: "a presence check over a partial clone is a WRITE. It belongs to the class already filed as a_verification_with_a_write_side_effect_cannot_witness_what_it_verifies, and it is the sharper instance: there the check dirtied a tree it was not asking about, here the check supplied the very object whose absence was the finding."
  the_repair: "tests/test_ecosystem_register.py sets GIT_NO_LAZY_FETCH=1 for every git invocation, and ASSERTS that the guard is effective rather than assuming it -- a test that silently lost the guard would go back to fetching its own evidence and reporting green."

# ----------------------------------------------------------------------
verified_by_planting_the_defect:
  method: "six defects planted one at a time into the artifact and into the test, each run, each restored. Required by architecture/proof_integrity.yaml before any pass here is worth anything -- a check nobody has watched fail is a check nobody has evidence about."
  a_recorded_referent_the_remote_does_not_serve: "the core head replaced with a syntactically valid sha no repository holds. test_each_recorded_remote_head_is_still_served_by_its_remote FAILED."
  an_alias_claim_that_is_false: "the compute layer's remote added to the acquisition layer's alias list. test_names_recorded_as_one_repository_have_identical_ref_sets FAILED, on the ref sets rather than on the name."
  a_posture_word_that_is_not_declared: "one member changed to `mostly_bearing`. test_every_member_carries_a_declared_posture FAILED."
  a_posture_class_declared_and_never_used: "an `ornamental` class added. test_no_posture_class_is_declared_and_unused FAILED -- the check that would have caught `declared_empty` being retired without its member."
  the_guard_removed_from_the_helper: "the GIT_NO_LAZY_FETCH assignment deleted. test_no_git_call_in_this_file_bypasses_the_no_lazy_fetch_helper FAILED."
  a_git_call_written_around_the_helper: "a bare subprocess.run([`git`, ...]) added to the test file. The same test FAILED -- which is the one that matters, because that is how the guard would actually be lost: not deleted, just not used by the next person."
  what_was_NOT_planted_and_why: "the lazy fetch itself. Reproducing it needs a partial clone holding an object it has not yet fetched, and running the probe consumes that state -- the objects arrive, and the plant cannot be re-armed without deleting someone's clone. test_a_presence_query_over_a_partial_clone_leaves_the_pack_count_alone measures the SIDE EFFECT instead, which is the part that stays checkable after the fact."

# ----------------------------------------------------------------------
what_this_register_still_cannot_see:
  the_contents_of_the_corpus_substrate: "its branch is named and unread. This is the one member classified on refs alone."
  whether_a_shared_ref_set_is_a_rename_or_a_mirror: "both produce identical refs. Undetermined, and stated as undetermined."
  private_or_unlinked_repositories: "the six here are the ones some checkout on this machine points at. A repository nothing here references is invisible to this method, and the method cannot tell that case from there being none."
  branches_other_than_each_remote_head: "ref sets were read in full and are recorded, but only head commits were inspected. A modification living on a branch nobody checked out would show as a ref and not as a finding."

what_this_register_does_not_propose:
  no_convention_imposed_on_the_forks: "the vendored_upstream posture exists precisely so that carrying no provenance conventions is a recorded classification rather than a gap. Making gromacs declare `extends: core@1.0.0` would be forking the science to fix the packaging."
  no_repository_renamed_archived_or_deleted: "three names resolving to one repository is measured and stated. Whether that is a rename with redirects or a deliberate mirror is undetermined, and a register is not where that gets decided."
  no_core_pin_bumped: "recorded above with its reason."
  no_claim_about_the_corpus_substrate_beyond_its_refs: "it has a branch. That is the whole of what is known."
