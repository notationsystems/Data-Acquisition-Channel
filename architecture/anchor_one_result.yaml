    prediction: "integration parameters will again be named by reference or absent -- and NAMED BY REFERENCE is a distinct absence class from `not reported`. Anchor 1 carries `Processing Method: GPC_LOWMW_031921`: the parameters that move Mn by tens of percent are present, in a system the artifact does not include."
    basis: MEASURED on one anchor
    why_the_refinement_matters: "`absent from the record` and `absent from this artifact and resolvable elsewhere` call for different things from a substrate. The first is unknowable; the second is a reference DAQ could carry and does not."

