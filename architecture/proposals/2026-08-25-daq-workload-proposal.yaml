  "note": "the universal gate the first issue required first -- variable-length array on the wire, generic configuration block, operation-generic result -- is BUILT as of 5447df3 and is no longer a term in any candidate's cost."
"serializer_note": "a bare ISO date is NOT used as a value anywhere in this record. The vendored canonical_yaml.py leaves 2026-08-25 unquoted, which PyYAML resolves to datetime.date while this repository's own reader returns str -- so such a value would have a parser-dependent hash. The serializer is byte-identical across both repositories by agreement and must not be edited on one side, so the field was removed instead. decision_id carries the date and is not date-shaped. Recorded as a measured gap in the shared serializer."
"status": "superseded"
"superseded_by": "architecture/decisions/2026-08-26-joint-workload-decision.yaml"
"superseded_note": "the decision record has claimed to supersede this proposal since it was written, while this record's own status still said 'proposed'. Two artifacts disagreeing about one record's state, with nothing checking -- the same shape as every other unbound claim found in this phase."
"superseded_recommendation": "fourier_transform_1d, recommended in the first issue of this proposal. It is now BUILT in the compute layer, so recommending it is no longer a decision. Withdrawn on completion, not on merit."
"tradeoff_recorded":
  "generality_falsification_argument": "this argument has been partly SPENT. It selected a transform because the substrate had been exercised by exactly one kernel family. The transform is now built, so the substrate has been exercised by two. convolution_1d is adjacent to the transform rather than orthogonal to it, so it falsifies less than Fourier did -- which is why this reissue's recommendation is weaker than the first issue's rather than merely different."
  "resolution": "the rule admits convolution_1d and nothing else in scope, so that is what DAQ proposes. The reissue records honestly that the rule's answer and the highest-value answer have come apart, and that closing the gap requires a paired DAQ extension the joint decision must elect."
  "reuse_leverage_argument": "least_squares to linear algebra to Kalman to PCA remains the strongest primitive-reuse chain, and the re-measure does not disturb its arithmetic. What changed is that its blockage is now precisely attributed: two DAQ-owned requirements and one compute-layer-owned family. It is deferred on a two-party pairing decision, not on ignorance of what it needs."
"validation_requirements":
  - "convolution with a unit impulse returns the input unchanged"
  - "convolution is commutative on constructed pairs"
  - "a known analytic pair convolves to its known result"
  - "associativity on constructed triples within tolerance"
  - "direct and transform-based strategies agree within tolerance, used as a CONSISTENCY check and never as the sole oracle"
"what_would_make_this_a_decision":
  - "the implicit-typing defect in architecture/canonicalization_defect.yaml resolved FIRST, in both repositories, since its fix re-hashes both exchange artifacts and any decision written before it would bind digests that are about to change"
  - "both artifacts then re-emitted and frozen under the corrected encoding, with new digests"
  - "a record committed where both digests can be verified against their ORIGIN repositories"
  - "authored with write access to both sides, or by both sides"
  - "an explicit election between convolution_1d under the rule as written, and a paired least_squares extension under the rule's second clause -- a choice this proposal frames but does not make"
