# WHAT THE PATH WILL DO TO A TABLE THAT MIXES MEASURED AND LITERATURE
# VALUES, AND CARRIES A DERIVED RESULT BESIDE ITS INPUTS.
#
# Section 13 of the SAME report the third anchor came from -- partition
# coefficient by HPLC under OECD 117. The document has been read; the
# acquisition has NOT been run. So these are predictions about the PATH,
# not about the document, and that is the only sense in which they are
# blind. Stated because the third anchor's predictions were blind in the
# stronger sense and these are not.
