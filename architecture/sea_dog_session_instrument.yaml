# THE sea_dog_session INSTRUMENT: what was built, what is blocked, and the
# two things its own doctrine names that do not exist.
#
# The instrument doctrine arrived as a GENERATED file -- header
# "Source: architecture/instruments.yaml, Regenerate: python3 generate.py,
# Source digest: 66629e18fca40af9". Neither the source nor the generator is
# in this repository, in the vendored substrate at the pin, in the Sea Dog
# Terminal repository the session studies, or in its archive mirror.
# Searched, not assumed. So this file is DAQ's own record of an instrument
# it implements and does not own: the doctrine cannot be regenerated here
# and its digest cannot be verified here.
#
# This is the shape already filed as chemistry_rule_ownership: a brief
# states a rule as active, the tree says otherwise, and the record keeps
# both rather than resolving it in either direction.
extends: core@1.0.0

subject: sea_dog_session_instrument
status: built_and_blocked_on_preconditions
owner: daf
enforcement: tests/test_sea_dog_session_instrument.py

instrument:
  id: sea_dog_session
  layer: daq
  implementation: session/work_order.py
  purpose: "convert a half-day of researcher time into the maximum number of discriminating answers, by ordering the queue on information yield and giving every item its own stopping condition."

# ----------------------------------------------------------------------
# What is built. Each invariant is enforced by a named refusal, and each
# refusal names an OBSERVABLE rather than a cause it cannot establish --
# the rule this repository already applies to EVERY_RUN_DIFFERS_IN.
# ----------------------------------------------------------------------
invariants_in_code:
  ordering_is_by_discrimination: NO_DECISION_IT_COULD_CHANGE
  acceptance_test_predates_the_work: ACCEPTANCE_TEST_POSTDATES_WORK
  terminates_on_the_stopping_rule: STOPPED_WITHOUT_THE_STOPPING_RULE

# The pre-registration invariant's own blind spot, found by probing it
# rather than by reading it. ACCEPTANCE_TEST_POSTDATES_WORK compares two
# positions and can only fire when BOTH exist; an item whose worked_at
# was never recorded ranked cleanly, accepted a finding and closed
# COMPLETE with the invariant unverifiable for it. Silent exactly where
# the record was incomplete, which is the hurried session it exists to
# catch.
the_invariants_blind_spot:
  refusal: WORKED_WITHOUT_A_RECORDED_POSITION
  what_it_says: "a finding exists for an item whose work position was never recorded, so the ordering cannot be checked. It names the missing record, not a motive: it does NOT claim the test was written late."
  and_what_it_does_not_refuse: "an item never worked and carrying no finding. That is not_reached, which the accounting already states."

validations_in_code:
  every_item_ranked_and_tested_before: NO_ACCEPTANCE_TEST
  every_finding_cites_its_sources: FINDING_CITES_NO_SOURCE
  residue_stated_or_explicitly_empty: RESIDUE_OMITTED

# The four deliverables. The first, second and fourth are shapes the
# module enforces; the third is the one whose named schema does not
# exist, below.
deliverables_in_code:
  the_work_order: "session.plan -- ranked by yield PER UNIT TIME, drops recorded, an empty order saying which empty it is."
  the_per_item_time_box: ABANDONED_WITHOUT_A_REASON
  a_findings_record_per_item: "session.Session.accounting -- every RANKED item in exactly one of worked / abandoned_at_its_box / not_reached, and the three conserve."
  the_residue_list: RESIDUE_OMITTED

# ROW ACCOUNTING, APPLIED TO THE SESSION. A ranked item that produced
# nothing must say WHICH nothing. `abandoned deliberately` and
# `abandoned by exhaustion` are the same event from outside; the reason
# is the only thing separating them, so an abandonment without one is
# refused, and an item both abandoned and reported is two answers to one
# question -- the shape replicate_pairing refuses per run.
session_accounting:
  buckets:
    - worked
    - abandoned_at_its_box
    - not_reached
  conserves: "sum of the three equals the number of ranked items, asserted, and no item appears twice."
  found_by_a_plant: "the first version of the conflict test asserted only the REFUSAL. Planting an overlapping bucket left it green: refusing the conflict is not the same as not double-counting it. The test now asserts conservation and disjointness, and the plant fails it by name."
  no_findings_at_all: "distinguished -- NO_ITEM_WAS_REACHED against EVERY_REACHED_ITEM_WAS_ABANDONED. Different afternoons, and an empty list states neither."
  the_plan_is_not_trimmed_to_fit: "an order whose boxes exceed the session reports overruns_the_box rather than dropping the tail. Which items to cut is the operator's call, and a plan quietly trimmed reads as a plan that fits."

# ----------------------------------------------------------------------
# THE OPERATOR SURFACE. The instrument enforced its invariants and could
# only be reached by writing Python. The preconditions it waits on are
# supplied by a person under time pressure on the morning of a session,
# and a mechanism reachable only through an import statement is reached
# by nobody -- so part of the blocked precondition was a missing FORM.
# ----------------------------------------------------------------------
operator_surface:
  intake: session/intake.py
  command_line: "python3 -m session plan <queue.json> | close <queue.json> <capture.json>"
  exit_codes: "2 for an unusable input, 1 for a session whose record carries refusals, 0 only when the record can be graded. The exit code is the operator's signal, and a record that cannot be graded must not exit 0."
  templates:
    - session/templates/queue.template.json
    - session/templates/capture.template.json
  refusals_at_the_file_boundary:
    MALFORMED_INTAKE: "unparseable is not empty. Returning an empty queue for a broken file is the class this instrument spends its surface refusing."
    QUEUE_FIELD_MISSING: "the field AND the item are named, so the operator is sent to one line rather than to the file. Nothing is defaulted: a value invented at load reaches the ranker wearing the operator's authority."
    UNKNOWN_QUEUE_FIELD: "a typo'd key is refused rather than dropped. A silently ignored key is a value the operator believes they set -- `minutes_` is not `minutes`, and the item would arrive looking like one that never had a box."
  why_json_and_not_yaml: "session/ may not import epistemics, which owns this repository's YAML subset parser, and a second parser here would be the duplicate-vocabulary problem in a new place. json is stdlib and is not a layer. The cost -- the operator writes JSON -- is the honest one."
  the_templates_carry_no_questions: "queue.template.json ships with items: [] and field notes only. A template with a question in it becomes the question. capture.template.json ships residue as an EMPTY LIST and stopping_rule_met as null, because a template that omits the residue teaches the omission and a template that defaults the stopping rule teaches the default."
  the_worked_example_is_labelled_fabricated: "session/templates/example.fabricated.json and its capture declare provenance: fabricated_example inside their own content, and a test asserts they say so -- the convention this repository already uses for the GPC fixture. They exercise all three outcomes and a drop, because an example that only shows the happy path teaches half the instrument."
  what_this_does_not_do: "it does not supply a queue. The researcher's questions must be obtained from them, in writing, before they see the instrument. A work order built from questions the builder invented would measure the builder."

# ----------------------------------------------------------------------
# THE FIRST NAMED-BUT-ABSENT ARTIFACT: the research finding schema.
# ----------------------------------------------------------------------
research_finding_schema:
  doctrine_says: "a findings record per item, conforming to the research finding schema"
  measured: absent
  searched: "this repository, vendor/scout-retrieval-agent at the pin, the Sea Dog Terminal working tree, and its archive mirror. No file, class or key of that name exists in any of them."
  what_was_done_instead: "session.Finding requires an evidence_class and refuses a finding that declares none (FINDING_DECLARES_NO_EVIDENCE_CLASS). It does NOT restate which classes are admissible: that vocabulary is owned by epistemics.evidence_class, and session/ may not import it under its own layer rule."
  why_not_a_local_copy: "a second copy of a closed vocabulary drifts from the first, and the import that would keep them in step is the one the layer rule forbids. The GPC extractor reached the same resolution when its first draft imported science.admissibility.UNCERTAINTY_KINDS: assert only what an acquisition layer can know, which is that the record said something rather than nothing."
  the_relation_is_bound_not_promised: "tests/test_session_instrument.py reads architecture/evidence_class.yaml, asserts `asserted` is still in the ingest set, and asserts that no class name from that set appears as a literal in session/work_order.py."
  what_is_not_claimed: "not that `asserted` is the right class for every session finding. The instrument requires a declaration and does not make it."

# ----------------------------------------------------------------------
# THE SECOND: the instrument's own source of truth.
# ----------------------------------------------------------------------
instrument_registry:
  doctrine_header_names: architecture/instruments.yaml
  claimed_digest: 66629e18fca40af9
  measured: absent_from_every_reachable_tree
  consequence: "the doctrine cannot be regenerated or digest-verified from here, and this instrument is not registered in any architecture catalogue that DAQ can see. Its placement in session/ is a decision recorded here, not one a registry dictated."
  not_reconstructed: "no instruments.yaml was written to make the header true. A generated file whose source was invented to match it is worse than a generated file with an unreachable source, because the second one says so."

# ----------------------------------------------------------------------
# Blocked, and on what. The doctrine's own facts block states this: the
# instrument has no external dependency and is blocked on calendar alone.
# ----------------------------------------------------------------------
preconditions:
  a_date_and_a_time_box: not_supplied
  the_question_queue: not_supplied
  a_stopping_rule: not_supplied
how_each_is_now_supplied: "queue.template.json carries box_minutes and the items; capture.template.json carries the stopping rule as a fact rather than a default. The date is the operator's calendar. The forms exist; the content is a person's to write."
consequence_of_the_block: "no session is planned, no work order is populated and no findings record exists. What is built is the thing that refuses a malformed one. A work order produced without the researcher's own questions would measure the builder."
what_would_discharge_it: "the four preconditions, in writing, before the session. The queue must be the researcher's own questions obtained BEFORE they see the instrument -- prior framing narrows what they try, and what they try is the measurement."
