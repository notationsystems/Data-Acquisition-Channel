# THE COHORT-IDENTITY PROBE, STATED BEFORE IT IS RUN.
#
# architecture/_probes/generality.yaml records cohort_identity as UNTESTED
# with the note that the probe "has not been run against them so much as
# found no way to run them", and the whole probe carries status
# paper_only. This file is the expectation half; the run is separate and
# comes after, so the ordering is in git rather than in a claim.
#
# WHY A PROBE NEEDS EXPECTED IDS AND NOT MERELY EXPECTED REFUSALS.
# Confirming a gate was REACHED is not confirming WHICH gate. A planted
# violation refused with the wrong invariant id is a gate reached and a
# claim unsupported -- the run would report "refused, as predicted" while
# the predicted mechanism did nothing. Every case below therefore names
# the id it expects, and an id-less "refused" is not a pass.
#
# The same failure this pair just measured one level up: two independent
# checks both passing established neither's property, because each was
# answering something adjacent to it.
extends: core@1.0.0

probe: cohort_identity
status: expectations_recorded_run_not_yet_performed
property_under_test: "a polymer is a POPULATION, not an object. Mn and Mw are moments of a chain-length distribution, and PDI is a ratio of two of them. Does anything in this substrate distinguish a measurement OF a population from a measurement of an individual?"

# --------------------------------------------------- the derived basis --

refusal_vocabulary_measured_before_stating_expectations:
  method: "collected every module-level refusal code across science/*.py programmatically rather than from memory."
  total_codes: 62
  gates: 5
  codes_naming_a_cohort_concept: 2
  re_taken_2026_09_03:
    what_it_was: "total_codes 46, codes_naming_a_cohort_concept 0. That zero was the probe's central finding: nothing in this substrate distinguished a measurement OF a population from a measurement of an individual, which is what the property_under_test asks."
    what_changed_it: "science/set_attestation.py, built the same night, introduced POPULATION_EMPTY and POPULATION_DISAGREES_WITH_THE_ATTESTED_N. They are set-level refusals -- a statistic stated over a population that is empty, or over a population whose size disagrees with what the source attested."
    it_is_a_real_change_and_not_a_string_collision: "the codes name a cohort concept in the sense the probe meant, not merely in the sense its regex matched. An attested coefficient of variation is a claim about a SET of runs and about no member of it, and refusing one for a population mismatch is the substrate declining to describe a cohort it was handed wrongly. The zero was true when it was measured and is no longer true."
    what_it_does_NOT_mean: "that the probe's property is now satisfied. Two refusal codes are not a cohort identity. Nothing yet distinguishes an Observation OF a population from one of an individual -- the attestation sits beside the values in science/ and never reaches content, an Observation, or any gate. The probe stays UNTESTED; what moved is the measured basis under one of its expectations, and it is re-stated here rather than left to fail its own guard."
    how_it_surfaced: "tests/test_cohort_identity_probe.py::test_no_gate_names_a_cohort_concept_at_all fired on the same commit that introduced the codes. The guard re-derives the vocabulary from science/*.py rather than trusting the number, which is why a premise lapsing was a failure rather than a silence."
  searched_for:
    - "COHORT"
    - "POPULATION"
    - "DISTRIB"
    - "BATCH"
    - "ENSEMBLE"
    - "AGGREGATE"
  what_that_licenses: "an expectation, not a result. Zero codes naming the concept means no gate CLAIMS to refuse on cohort grounds; whether some gate refuses incidentally is exactly what the run measures."

# ------------------------------------------------------- the plantings --
#
# Each case names what it expects and, where a refusal is expected, the
# EXACT id. `expected_refusal_ids: []` means ADMITTED IS THE PREDICTION --
# not an absence of prediction.

cases:

  - name: a_population_as_a_referent
    plant: "Referent(natural_key='PS-lot-4471', kind='polymer_batch')"
    expected_admitted: true
    expected_refusal_ids: []
    reasoning: "Referent.kind is an open string documented as 'material | instrument | process | sample | concept | ...'. Nothing constrains it, so a population kind is constructible and indistinguishable from an object kind."
    what_a_refusal_would_mean: "the expectation is wrong and kind is constrained somewhere this survey missed."

  - name: a_distribution_moment_as_a_scalar_measurement
    plant: "an observation whose value is Mn = 104000 g/mol on that batch, with conditions and a unit"
    expected_admitted: true
    expected_refusal_ids: []
    reasoning: "Mn is a finite float with a unit, so every cell rule is satisfied. THIS IS THE PROBE'S POINT: a moment of a distribution is admitted as if it were a point measurement of an object, and nothing records which it is."
    what_a_refusal_would_mean: "a gate does distinguish, and the UNTESTED verdict in generality.yaml is wrong."

  - name: the_full_distribution_as_the_value
    plant: "the same observation with value = a chain-length vector and a per-component unit list"
    expected_admitted: true
    expected_refusal_ids: []
    reasoning: "this is shaped exactly like a multivariate measurement, which the structured-uncertainty work admits by design. A distribution and a measurement vector are the same bytes."
    what_a_refusal_would_mean: "the multivariate path distinguishes them, which would be a stronger result than expected."

  - name: pdi_as_a_ratio_with_no_lineage_to_its_moments
    plant: "PDI = 1.05 as an observation, with no declared relationship to the Mn and Mw it is computed from"
    expected_admitted: true
    expected_refusal_ids: []
    reasoning: "lineage_depth only engages when a record DECLARES recursion. An undeclared derivation is not partially-declared, so PARTIALLY_DECLARED_RECURSION does not fire."
    what_a_refusal_would_mean: "the lineage gate reaches undeclared derivations, which would close part of this gap already."

  - name: a_scalar_uncertainty_on_a_distribution_moment
    plant: "Mn with a scalar standard error"
    expected_admitted: true
    expected_refusal_ids: []
    reasoning: "the ONLY-WHEN clause fires on a MULTIVARIATE VALUE, and Mn is scalar. A scalar sigma on a scalar value is exactly the admitted case -- even though the underlying quantity is a distribution whose spread is the physically interesting part."
    what_a_refusal_would_mean: "SCALAR_UNCERTAINTY_ON_A_MULTIVARIATE_VALUE fires on a scalar, which would be a defect in that gate rather than a finding here."

# --------------------------------------------------------- the verdict --

predicted_outcome:
  cases: 5
  predicted_admitted: 5
  predicted_refused: 0
  the_claim: "no gate in this repository refuses an observation on the grounds that its subject is a population rather than an object, and none records the distinction either. cohort_identity is UNTESTED because there is nothing to test, not because nobody ran it."

how_this_probe_can_fail_honestly:
  - "any case refused -> the expectation is wrong and the survey missed a constraint. Record the id and revise."
  - "any case refused with an id NOT listed above -> the gate was reached and the claim is unsupported. This is the outcome the run must be able to distinguish, and the reason ids are named rather than counted."
  - "all five admitted -> the predicted outcome, and the finding is a REPRESENTATION GAP rather than a defect: nothing is broken, and nothing distinguishes a population from an object."

what_this_probe_does_not_decide: "whether the substrate SHOULD distinguish them. A gap measured is not a change proposed -- that belongs in a joint record with a workload paired to it, under the rule that made least_squares a decision rather than a wish."

# ======================================================================
# THE RUN. Appended after the expectations above were committed (eeb1c36),
# and after the run itself was written against them. The expectations are
# NOT edited: what was predicted stands as predicted, and what happened is
# recorded beneath it.
# ======================================================================
run:
  performed_by: tests/test_cohort_identity_probe.py
  cases_run: 5
  cases_admitted: 5
  cases_refused: 0
  refusals_naming_a_cohort_concept: 0
  verdict: PREDICTION_HELD

  what_it_establishes: "no gate in this repository refuses an observation on the grounds that its subject is a POPULATION rather than an object, and none records the distinction. A polymer batch is constructible as a Referent because `kind` is an open string; Mn is admitted as a scalar measurement indistinguishable from a single-object one; the full chain-length distribution is admitted through exactly the multivariate path a measurement vector uses; PDI is admitted with no lineage to the moments it divides, because the lineage gate engages only on DECLARED recursion; and a scalar uncertainty on a distribution moment is the admitted case, even though the spread is the physically interesting part."

  what_it_does_not_establish: "that this is a defect. Nothing is broken -- every gate did what it says. It is a REPRESENTATION GAP: cohort_identity was recorded UNTESTED because there was nothing to test, not because nobody ran it, and that is now measured rather than inferred."

  # ------------------------------------------------------------------
  # THE PROBE CAUGHT ITS OWN CONSTRUCTION THREE TIMES, and each time the
  # named-id discipline is what made the mistake legible rather than
  # counting it as a result.
  # ------------------------------------------------------------------
  the_probe_caught_its_operator:
    first: "the run fed TABLE-shaped content to the PROPERTY gates, which govern a different shape. Four of five cases refused, with MISSING_PROPERTY, MISSING_METHOD, MISSING_UNCERTAINTY_KIND and UNTYPED_QUANTITY. Counting refusals would have concluded THE SUBSTRATE REFUSES POLYMER OBSERVATIONS. Not one of those ids is a cohort id, and that is the only reason it was visible. Fixed by expressing each case in both shapes and showing each gate only the shape it governs."
    second: "the planted uncertainty_kind was `standard_error`, which is not in the vocabulary -- UNCERTAINTY_KINDS is (stated, estimated, propagated, absent). UNKNOWN_UNCERTAINTY_KIND fired. Again a refusal, again nothing to do with cohorts."
    third: "the property gates were imported under a name that does not exist. That one failed loudly at import and could not have been mistaken for a result, which is the contrast worth keeping beside the other two."
    the_general_statement: "A GATE APPLIED TO CONTENT IT DOES NOT GOVERN PRODUCES REFUSALS THAT ARE NOT EVIDENCE. A reachability proof that counts refusals cannot tell those from the ones it was looking for, and this probe produced four of them before producing zero real ones."

  why_this_is_the_demonstration_the_probe_was_for: "the constraint on this probe was that confirming a gate was REACHED is not confirming WHICH gate. That was stated as a risk and then occurred, three times, in the probe written to respect it. The predicted-id comparison is what separated 'refused' from 'refused for the reason claimed' on every one."

# ----------------------------------------------------------------------
# THE FLAGGED FOLLOW-ON, measured after the run: is PDI-without-lineage the
# COMPOSITION GUARD'S BOUNDARY, or a SECOND UNOWNED RELATION?
#
# The diagnostic offered was whether the quantities are jointly interpreted
# downstream. Measured, they are, and the answer is the second.
# ----------------------------------------------------------------------
the_pdi_relation:
  question: "PDI is admitted with no lineage to the moments it divides. Is that generation_depth_bounded's declared boundary, or a relation nobody owns?"
  answer: A_SECOND_UNOWNED_RELATION

  why_it_is_not_the_composition_guard_s_boundary: "the lineage gate governs DECLARED recursion -- a computation stating stream_identity, window_or_horizon and initialization_provenance. A PDI printed by a GPC instrument declares none of that and correctly should not: it was not computed here. The instrument derived it. Observation is documented as 'always tied to exactly one extraction event over one Record', and that extraction event is real. So the lineage gate is not failing to reach this; the relation is outside what it is about."

  what_is_actually_missing: "any way to say that one observation is a FUNCTION of two others. Measured: DerivedValue.derived_from expresses exactly this and applies only when the derivation happens HERE. ClaimedRelationship relates REFERENTS -- from_referent_id, to_referent_id -- so it cannot relate observations at all. Nothing else in science/, epistemics/, daf/ or the vendored evidence types names functional dependence between observations; a search for functional/depends_on/computed_from/not_independent returns nothing."

  the_joint_interpretation_measured_not_argued: "Mn, Mw and PDI on one batch share sample_id and conditions, so the aligned observation table joins them into ONE ROW as THREE INDEPENDENT COLUMNS. All three are admissible; verified directly. And Mw/Mn = 1.050000 equals the declared PDI to six decimal places -- the third column carries no information the first two do not."

  the_concrete_consequence: "a consumer fitting over those columns, or propagating uncertainty across them, double-counts one measurement. Nothing in the row, the gate or the table records the dependence, so nothing can warn it."

  why_it_is_the_polymer_vertical_s_decision: "the shape is general -- any derived-at-source quantity arriving beside its inputs has it -- but whether the substrate should carry inter-observation functional dependence is a representation change, and this pair's rule is that a workload names its extension. Recorded as a framing for the vertical, with data in hand, not as a proposal."

  what_would_settle_it: "a real polymer acquisition where a GPC report supplies Mn, Mw and PDI together. If the downstream consumer treats them as independent, the cost is measurable rather than argued."
