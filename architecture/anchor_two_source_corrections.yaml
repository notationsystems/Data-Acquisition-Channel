what_the_fixture_does_about_the_merge:
  the_decision: "the fixture KEEPS the blank Sample cell and states in its provenance sidecar that the source has a merged cell rather than a blank."
  why_not_fill_it: "filling it is still an interpretation -- the value is present by geometry and a CSV cannot express geometry. Filling it silently would encode the interpretation as a transcription. What changes is the NAME of the interpretation: not `the document leaves this blank` but `the document merges this cell and CSV cannot carry that`."
  what_would_actually_carry_it: "a fixture format with cell extent. Not built, and not proposed here: it is a change to what a fixture IS, and this session has measured the need rather than designed the answer."

what_is_not_done: "DAQ-3. The injection reversal is confirmed from the source -- Table II labels Mn 26,459 as injection 1, and the instrument block carrying that value reads `Injection #: 2` acquired at 09:51:01, after 09:24:17. What is NOT measured is which identifier the extractor takes when a fixture carries all three, and whether anything downstream can tell it took the wrong one. That needs a fixture that carries all three, which the merged-cell finding says a CSV cannot faithfully be."
