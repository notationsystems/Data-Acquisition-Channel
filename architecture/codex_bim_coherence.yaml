# THE LARGEST CODEX SURFACE IN THE ACCOUNT HAD NEVER BEEN OPENED, AND THE
# INSTRUMENT BUILT TO RE-MEASURE CODEX'S WORK COULD NOT SEE IT.
#
# Measured 2026-09-03, over the account catalogue rather than over this tree.
