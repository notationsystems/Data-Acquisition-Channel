# THE NOTATION SYSTEMS ECOSYSTEM, MEASURED -- INCLUDING ITS REMOTES.
#
# Notation Systems builds and operates provenance-bearing computational
# corpora. This file asks the question that sentence implies and nobody
# had asked: WHICH OF OUR REPOSITORIES ACTUALLY BEAR PROVENANCE, and what
# are the others?
#
# It is the same move as architecture/exchange/invariant_register.yaml one
# level up. That register asked whose invariants, held where, checkable by
# whom, across three parties inside one pair. This asks it across the
# company.
#
# ----------------------------------------------------------------------
# HOW THE FIRST DRAFT OF THIS FILE WAS WRONG, AND WHY THAT IS THE HEADLINE.
#
# A draft written on 2026-08-29 measured only LOCAL CHECKOUTS and said so
# honestly, under `what_this_register_cannot_see`. Every one of its three
# findings was then falsified by measuring the thing it had declined to
# measure. It reported:
#
#   * three core objects sharing no history  -> ONE history, and the
#       "no shared objects" reading was manufactured by the instrument
#   * an acquisition layer of two repositories -> ONE repository, three
#       names
#   * an empty corpus-substrate member         -> an empty CHECKOUT of a
#       repository holding an active branch
#
# Three for three. A register that names its own blind spot and publishes
# anyway is not thereby safe: the caveat was accurate and the FINDINGS
# were still wrong, because each one was a claim about the ecosystem
# inferred from a sample the caveat had already said was partial. Stating
# a limit does not license reasoning past it. That is the entry this file
# earns in architecture/proof_integrity.yaml, and it is worth more than
# the register.
# ----------------------------------------------------------------------
extends: core@1.0.0

artifact: ecosystem_register
owner: daf
status: measured_2026_09_03_local_and_remote
enforcement: tests/test_ecosystem_register.py

method:
  local: "each checkout's HEAD, branch, and parsed `extends: core@<version>` count, read from the working tree."
  remote: "`git ls-remote` against each remote, which reads REFS and touches no object store. Refs are what a repository IS at a name; object reachability is not, for the reason recorded under the_instrument_that_manufactured_a_finding."
  identity_of_a_repository: "TWO NAMES ARE ONE REPOSITORY WHEN THEIR FULL REF SETS ARE IDENTICAL. Chosen over object-sharing deliberately: GitHub serves a fork's whole network from one object store, so `does remote R serve commit C` is true across every fork of anything and identifies nothing. Ref-set identity is the discriminating measurement, and it was the one that separated six repositories from ten names."
  a_remote_head_is_a_dated_reading_and_the_date_is_in_minutes: "MEASURED, not assumed. The enforcement test was written asserting recorded heads against live ones, and failed on its first run: two remotes had moved in the eleven minutes since the register was written -- the acquisition branch by one commit, the corpus substrate by one. Concurrent sessions are pushing to these branches while this file is being edited, so a register that pins exact head values is stale before it is committed. The disposition is NOT to drop the reading. It is to record it as `remote_head_at_measurement` with the time, and to assert the property that actually matters, below."
  a_remote_head_is_recorded_UNABBREVIATED_and_that_is_not_a_style_choice: "the enforcement test verifies a recorded referent by fetching it from the remote, and `git fetch <url> <sha>` requires the FULL forty characters -- an abbreviation is resolved against a local object database, and the throwaway repository doing the fetch has none. Recording seven characters made all six members report `no longer served`, six false alarms with one cause. This is the SECOND time in one artifact that an abbreviated sha inverted a result: the first produced the share-no-objects finding recorded below. The rule this file adopts is the pair's own, arrived at again from a new direction -- THE PARTICIPATING REFERENT IS RECORDED IN FULL, and the abbreviation is a reading aid that may appear in prose and may never be the thing a check joins on."
  the_property_asserted_about_remote_heads: "THE RECORDED HEAD IS STILL SERVED BY THE REMOTE. A branch advancing is ordinary work and must not fail a suite. A recorded commit that the remote no longer serves is a rewrite, a force-push or a collection -- and it silently voids every claim made relative to that referent, which is the failure this pair has a whole vocabulary for. Advance is expected; disappearance is a finding."
  HOW_THE_CANDIDATE_NAMES_ARE_FOUND_AND_WHY_THAT_CHANGED: "DERIVED, since 2026-09-03, and the change is the third correction this file has taken for one defect. The first two versions enumerated candidate names from THE REMOTES OF CHECKOUTS ON THIS MACHINE -- a source that cannot contain a name nothing here points at, which is the coverage-by-enumeration shape architecture/proof_integrity.yaml calls its most-instanced class. It missed `data-acquisition-fabric`, found by the census; then it missed `Payload-Terminal-V0` and `Scientific-Compute-Layer-SCL-`, named in epistemics/corpus/contract.json, a file this repository carries. The names are now SWEPT from every hand-authored file in the tree by pattern, and each is resolved. That found eleven repositories where the enumeration found six."
  the_sweep_excludes_the_vendored_core_and_that_is_load_bearing: "names inside vendor/ are the references OF THE CORE to its own environment, not the claims of this repository about the ecosystem. Swept separately they yield two further real repositories -- SP1-zero-knowledge-virtual-machine and risc0-zero -- and one path that resolves nowhere. Folding the two scopes together would attribute the expectations of the core to this layer."
  what_is_still_not_measured: "whether identical ref sets arise from a rename-with-redirect or from a mirror. Both produce exactly this signature and nothing observed here distinguishes them. Recorded as undetermined rather than guessed."

# ----------------------------------------------------------------------
# THE POSTURE CLASSES. What makes these apparatuses rather than a pile is
# that each has a DIFFERENT RELATIONSHIP TO PROVENANCE, and the difference
# is a property of the member rather than of how much work it has had.
# ----------------------------------------------------------------------
posture_classes:
  bearing: "carries the provenance conventions itself -- artifacts declaring `extends: core@<version>`, a class record, and gates that refuse rather than guess. A corpus this member produces is interrogable back to evidence."
  core: "the substrate the bearing members extend and declare themselves relative to. Vendored, not depended on: `modifiable: false`, used without copying or modifying a line. Its identity is what `bent: zero` is a claim about."
  vendored_upstream: "third-party scientific software, forked to pin a version rather than to change it. It carries NO provenance conventions and must not be made to -- imposing them would fork the science, not the packaging. What is owed instead is a recorded pin and a statement of what was NOT modified."
  named_and_unresolvable: "a repository this tree NAMES and that an unauthenticated `git ls-remote` cannot resolve -- GitHub answers with a credential challenge rather than a ref list. That answer is the SAME for a repository that does not exist and one that is private, and nothing available here separates them. Distinct from declared_empty_on_the_remote, where the remote answers and the list is empty: there the repository certainly exists. Recorded as a posture rather than an omission because the alternative is a name in the tree that the register has no row for."
  declared_empty_on_the_remote: "the remote answers and returns NO REFS. Not unreachable, not private, not slow -- `git ls-remote` exits zero with an empty list, which is what an initialised repository nobody has pushed to looks like. THE FIRST DRAFT OF THIS FILE USED A CLASS BY THIS NAME AND RETIRED IT, because it had been assigned on the strength of an empty local CLONE and the member turned out to hold an active branch. The name comes back with the measurement moved to where it belongs: an empty checkout is a fact about a machine, an empty ref list is a fact about the repository."
  unclassified: "it resolves, and nothing here has read it. DISTINCT FROM every other class in this list, which are all statements about a member; this one is a statement about this register. It exists so that a repository found by the sweep can be recorded WITHOUT a posture, because the alternative -- leaving it out until someone has time to read it -- is how five members stayed invisible through two versions of this file. A member may sit here indefinitely; what it may not do is be absent."
  bearing_under_a_different_contract: "carries provenance conventions of its own -- content-addressed identity, knowledge time, machine-readable warrants -- and declares itself to a DIFFERENT authority than `core@1.0.0`. Not a lesser posture than `bearing` and not a defect: it is the posture that makes the join question real, because two apparatuses can both be rigorous and still not compose. It replaced `unsurveyed`, which held this member until it was read; and `unsurveyed` in turn replaced `declared_empty`, which was wrong because an empty checkout is a fact about this machine, never about the member."

