# WHAT MOVING THE CORE PIN WILL DO, RECORDED BEFORE IT IS MOVED.
#
# architecture/ecosystem_register.yaml measured that the vendored core is
# SIX COMMITS behind its remote branch and that the package version did
# not change across them. architecture/core.yaml wrote that exact failure
# mode down before it occurred: "it is a submodule bumped to a commit
# whose pyproject still says 1.0.0. Patch commits do not bump versions.
# Every check passes, the recorded commit is silently wrong, and every
# `extends` still agrees."
#
# The pin has NOT moved, so nothing here is currently stale. What follows
# is therefore a preregistration and not a report: predictions about a
# bump that has not happened, made while their answers are still unknown,
# so that whoever performs it can be scored rather than believed.
#
# WHY IT IS WORTH DOING AT ALL. Waiting at the head is the artifact this
# pair asked for and recorded as unanswerable --
# architecture/exchange/ste_invariant_declaration.yaml, authored by the
# core as owner. Our own architecture/exchange/ste_invariants.yaml carries
# `RECONSTRUCTION_NOT_DECLARATION` and a warning never to cite it as the
# core's own statement. It was right to. The statement now exists.
extends: core@1.0.0

