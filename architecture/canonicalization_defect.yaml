  "method": "each scalar emitted through the shared architecture/exchange/canonical_yaml.py, then read back with BOTH parsers -- epistemics/_yaml.py (this repository's dependency-free reader) and PyYAML -- and compared as TYPED VALUES, not as bytes"
  "note_on_examples": "example scalars below are backtick-wrapped so that this document, which is ABOUT implicit-typing divergence, does not itself exhibit it under the very serializer it describes."
  "scalars_tested": 20
  "scalars_that_diverge": 6
"owner": "joint -- the serializer is byte-identical in both repositories by agreement"
"status": "corrected_applied_in_both_repositories"
"summary": "The pinned encoding's scalar rule is wrong, and the ISO-date divergence reported earlier is one instance of a class rather than the defect. YAML implicit type resolution means two conformant parsers can disagree on a scalar's TYPE while agreeing on the bytes -- so a byte-identical artifact can still hash-bind a different typed structure on each side. The original rule, 'strings double-quoted only where required by the spec', is the error. It should be: strings ALWAYS double-quoted."
"why_not_patched_here": "architecture/exchange/canonical_yaml.py is byte-identical to the compute layer's copy BY AGREEMENT, and that agreement is what makes either artifact's hash mean anything. Editing it on one side would break the agreement and silently re-hash every artifact already committed against it -- including architecture/exchange/daq_capabilities.yaml and the compute layer's own requirements artifact. The change must land in both repositories together, and every artifact and every hash reference must be reissued in the same coordinated step."
