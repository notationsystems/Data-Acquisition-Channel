# The DAF execution-record contract.
#
# STRUCTURAL INFORMATION, so it lives here rather than in doctrine --
# architecture/doctrine.yaml's own routing rule sends structure to
# schemas and keeps doctrine to role behaviour. This file is listed as a
# doctrine SOURCE, so the generated projection's source digest covers it,
# but its field table is deliberately not projected into prose.
#
# OWNERSHIP (Phase 26 reconnaissance). Case B: an identity substrate
# already existed and no execution-event record did.
#   reused:   evidence.identity.content_hash -- the same primitive every
#             other id in this repository uses
#   reused:   the field vocabulary of core.canonical.version.ProvenanceInfo
#             and morpho.provenance.ProvenanceRecord (source, timestamp),
#             rather than coining synonyms for them
#   not found: any record of an EXECUTION EVENT anywhere in the repository
#             or the vendored substrate. evidence/provenance.py is
#             DerivedValue ancestry traversal; ProvenanceInfo describes a
#             canonical Version; ProvenanceRecord describes a Morpho
#             compilation. None describes an acquisition run.
extends: core@1.0.0

status: implemented
owner: daf
scope: daf_acquisition_only
integration_dependency: "canonical for DAF acquisition only. A broader unified substrate that later grows its own execution-record contract should absorb this one, not sit beside it."

# ------------------------------------------------------------------------
# THE DIVERGENCE, AND ITS RESOLUTION.
#
# The compute layer raised, in its own requirements artifact, that the
# joint integration contract specifies an ExecutionRecord carrying
# computation-shaped fields (backend, backend_version, hardware, seed,
# verification_status, computation_identity) while this file already
# defines a record of the same name whose fields are acquisition-shaped
# and disjoint from those. Raised correctly and left unresolved there,
# because this record is owned here.
#
# It is resolved here rather than deferred, because a joint decision
# record bound to both artifacts by hash would otherwise be written
# against two different contracts that share a name -- a divergence
# invisible in the hashes and discovered at wiring time.
# ------------------------------------------------------------------------

divergence_resolution:
  status: decided
  decided_by: daf
  authority: "this repository owns the committed contract, so the shape is DAF's to choose. What the compute layer's record must contain remains the compute layer's to specify."

  shapes_considered:
    - id: A_discriminated_kind_with_shared_core
      description: "one ExecutionRecord with an explicit `kind` discriminant; a shared core carrying the INTERSECTION of the two field sets, plus one kind-specific block per kind"
      verdict: adopted
      reason: "absorbs rather than sits beside, which is what integration_dependency above already requires. Preserves the two-hash identity discipline unchanged. The discriminant is a value in the payload, so execution_record_from_dict can reconstruct the right kind without a type registry."

    - id: B_abstract_contract_two_concretes
      description: "an abstract ExecutionRecord contract with AcquisitionExecutionRecord and ComputationExecutionRecord concretes"
      verdict: rejected
      reason: "records are persisted as JSON and rebuilt by execution_record_from_dict, so the concrete type must be recoverable FROM THE PAYLOAD -- which requires a discriminant field anyway. B therefore collapses into A at the persistence boundary, with a type hierarchy added on top that buys nothing. Not rejected as wrong; rejected as A with ceremony."

    - id: C_rename
      description: "rename the compute layer's record to ComputationRecord and leave this one untouched"
      verdict: rejected
      reason: "produces exactly the two-records-side-by-side arrangement integration_dependency rules out, and discards real shared structure -- both are execution EVENTS with the same identity-before-outcome problem and the same tamper-evidence requirement. Retained as the fallback if the intersection below is ever found to be empty; it is not."
      cost_if_reconsidered: "cheapest by far, and zero migration"

  # CORE MEMBERSHIP RULE. Stated here because the next field to be
  # considered will face the same choice, and the first version of this
  # rule was insufficient in a way that only showed up under a concrete
  # field.
  #
  #   core membership requires BOTH:
  #     present in every kind
  #     AND identical semantics across kinds -- a consumer must be able to
  #     compare the field across kinds WITHOUT KNOWING which kind it holds
  #   presence without semantic agreement -> per-kind branch, and the
  #     names should differ if the meanings do
  #
  # The first rule tested PRESENCE only. That is how a junk drawer forms:
  # a field present in both kinds and meaning different things in each
  # passes a presence test, lands in the core, and then returns a correct
  # answer for one kind and a silently wrong one for the other -- no
  # error, no type failure, just a wrong equality. `operation_id` failed
  # exactly that way and is no longer in the core; see
  # core_membership_rule below for the worked case.
  shared_core:
    - id: "execution identity: H(<the kind's own request identity>, runtime_id, started_at). The DERIVATION is per-kind; the MEANING -- which run -- is not, and equal id across any two records means the same execution regardless of kind, so it passes the comparability test."
    - runtime_id: "caller-supplied, never read from the environment behind the caller"
    - started_at
    - finished_at
    - status: "SUCCEEDED or FAILED"
    - input_fingerprint: "hash of what was asked for"
    - output_fingerprint: "nullable; null on failure, never a hash of the empty set"
    - error
    - parent_execution_id
    - content_digest: "integrity over every field except id and itself"

  acquisition_only:
    - acquisition_operation_id: "H(plan_id, source_id, parameters, mode). IMPLEMENTATION-INDEPENDENT by deliberate design -- the adapter is excluded, because this file already holds that a coordinate is never an identity. Renamed from operation_id when it left the core: the name differs because the meaning does."
    - plan_id
    - source_id
    - adapter_id
    - adapter_version
    - outcome
    - artifact_ids
    - version_ids
    - admission_failure_count

  computation_only:
    - computation_request_id: "the compute layer's own request identity, which INCLUDES the backend -- so the same mathematics dispatched to a different backend is a different request there. Implementation-DEPENDENT, and correctly so for its domain. Named differently from acquisition_operation_id precisely so nothing invites comparing the two."
    - backend
    - backend_version
    - hardware
    - seed
    - verification_status
    - computation_identity

  # The corrected rule, as data rather than only prose, so the lock test
  # can hold the next field to it.
  core_membership_rule:
    requires_both:
      - present_in_every_kind
      - identical_semantics_across_kinds
    comparability_test: "a consumer must be able to compare the field across kinds WITHOUT KNOWING which kind it holds, and get a right answer"
    on_presence_without_semantic_agreement: "move to the per-kind branches, and give the branches DIFFERENT NAMES if the meanings differ -- a shared name across differing meanings is the invitation to compare that the rule exists to remove"
    why_the_first_version_was_insufficient: "it tested presence in both kinds and nothing else. That is exactly how the junk drawer forms: a field present in both and meaning different things in each passes, lands in the core, and then answers correctly for one kind and silently wrongly for the other. No error, no type failure -- just a wrong equality."

    worked_case_operation_id:
      passed: present_in_every_kind
      failed: identical_semantics_across_kinds
      the_disagreement: "DAF's operation_id is H(plan_id, source_id, parameters, mode) and deliberately EXCLUDES the adapter, because a coordinate is never an identity here. The compute layer's request identity INCLUDES the backend, so the same mathematics on a different backend is a different request there. BOTH ARE RIGHT FOR THEIR DOMAIN -- this is not an error on either side to be corrected, which is what makes it dangerous."
      consequence_if_it_had_stayed: "a consumer reading it from a core-typed record would conclude that equal values mean the same logical request regardless of how it ran: true for acquisition, false for computation. A shared core CONTAINING this field is worse than one without it, because the core is what promises comparability."
      resolution: "moved to the per-kind branches as acquisition_operation_id and computation_request_id. Two names, because two meanings."
      why_not_keep_it_with_a_constraint: "an earlier revision kept it in the core and required implementation-independence of every kind. That imposes DAF's semantics on the compute layer's own identity model to preserve a field position -- the wrong trade. Moving it costs nothing while there is one kind, and each branch naming its own is cleaner than a constrained shared name."

    consequence_for_the_core: "the core now carries NO kind-relative identity field. `id` remains, and passes on its own terms: its DERIVATION is per-kind (it hashes whichever request identity the kind has) but its MEANING is not -- equal id means the same execution under any kind. Derivation may be kind-specific; meaning may not."

    fields_re_read_and_found_genuinely_shared:
      runtime_id: "WHERE a run happened: python version, platform, hostname, pid. Describes the orchestrating process, identically for both kinds."
      started_at: "caller-supplied ISO-8601, caller-supplied for the same reason in both -- this repository never reads the clock behind a caller"
      status: "a two-value closed vocabulary, identical meaning"
      input_fingerprint: "hash of what was asked for, identical across a run and a retry"
      output_fingerprint: "nullable, null on failure, never a hash of the empty set -- an absence discipline both kinds need identically"
      parent_execution_id: "the previous execution of the same operation. Note it inherits 'same operation' from the kind's own identity field, so it is comparable across kinds only in the weak sense that both point at an execution id -- which is itself core."
      content_digest: "integrity over the outcome, deliberately excluded from identity"

    runtime_id_and_hardware_are_not_the_same_field: "runtime_id describes the ORCHESTRATING PROCESS; the compute layer's `hardware` describes the COMPUTE DEVICE. A CPU-versus-GPU distinction lives in hardware and backend, never in runtime_id. Both survive; recorded because they look adjacent enough to be merged by someone tidying later."

  # Merges that were considered and REFUSED, because the shared core is
  # the intersection and each of these is an analogy rather than an
  # identity. Recorded so a later phase does not quietly perform one.
  refused_merges:
    adapter_version_and_backend_version: "both are 'what code ran, content-addressed', but adapter_version hashes adapter and extractor MODULE SOURCE while a backend version identifies a compiled build. Merging them would change what content_digest covers for existing records in exchange for a word. If a unified implementation_version is ever wanted, it is a deliberate change with its own record, not a side effect of this one."
    outcome_and_verification_status: "both are kind-specific closed vocabularies. AcquisitionOutcome's values say what happened to an acquisition; a verification status says what was established about a computation. Different questions."
    output_fingerprint_and_computation_identity: "NOT analogous, and the most important refusal of the three. output_fingerprint hashes the output alone; computation_identity is H(operation_id, input_id, output_id, exit_code) -- a different arity over different material. Placing it in the core would silently redefine output_fingerprint for acquisition records."

  migration_cost:
    id_unchanged: "H(operation_id, runtime_id, started_at) does not include `kind`, so every existing execution id is preserved"
    content_digest_changes: "content_digest covers every field except id and itself, so introducing `kind` re-digests every stored record and every persisted record would fail execution_record_from_dict's ExecutionIntegrityMismatch check on load"
    conclusion: "a real migration, whose cost falls entirely on stored acquisition records and buys nothing until a second kind exists to discriminate"

  implementation_timing:
    decision: "the SHAPE is fixed now; the schema change is not made now"
    reason: "no computation kind exists in this repository to discriminate toward, so introducing a one-valued discriminant would break every stored record's integrity check in exchange for no present capability. Fixing the shape before the second kind exists is the point -- it is this repository's own established posture: Phase 25 built the constraint checker 'authored before there is a binding to accommodate, so the first binding anyone adds is checked by a rule that did not bend around it'."
    what_is_enforced_now: "the intersection above is locked by tests/test_execution_record_divergence.py, so a field cannot be added to the shared core later without meeting the intersection test. Writing the rule before the thing it constrains is the whole mechanism."
    is_this_a_bend: "no. No invariant's semantic domain changes: execution_recorded, execution_is_not_evidence and execution_identity_is_separate all keep their exact meaning under a discriminated record. This is a schema migration, not a weakening."

implementation:
  record: daf/execution/record.py
  identity: daf/execution/identity.py
  quarantine: daf/execution/quarantine.py
  store: daf/execution/store.py
  seam: daf/execution/recorded.py
  enforcement: tests/test_execution_record.py

# Two hashes, with deliberately different semantics.
identity:
  execution_id:
    payload:
      - operation_id
      - runtime_id
      - started_at
    minted: before the run begins
    stable_across_runs: false
    rationale: "two runs are two events; an id that depended on the outcome could not exist before the outcome did"
  content_digest:
    payload: every field except id and content_digest
    minted: when the run ends
    rationale: "the identity hash deliberately excludes the outcome, so integrity over the outcome needs its own digest"
  operation_id:
    payload:
      - plan_id
      - source_id
      - parameters
      - mode
    stable_across_runs: true

fields:
  id: execution identity
  operation_id: acquisition identity
  runtime_id: "python version, platform, hostname, process id -- caller-supplied, never read from the environment behind the caller"
  started_at: caller-supplied ISO-8601
  finished_at: caller-supplied ISO-8601, nullable
  plan_id: coordinate, never an identity
  source_id: coordinate, never an identity
  adapter_id: "nullable -- null means no adapter ran, which is a fact rather than missing data"
  adapter_version: "nullable -- content hash of the adapter and extractor module source, derived from the code that runs rather than a hand-maintained string"
  status: SUCCEEDED or FAILED
  outcome: the AcquisitionOutcome value
  input_fingerprint: "hash of what was asked for; identical across a run and a retry of the same request"
  output_fingerprint: "nullable -- null on failure. Never a hash of the empty set: a run that produced nothing and a run whose output was empty are different facts"
  artifact_ids: sorted
  version_ids: sorted
  admission_failure_count: integer
  error: nullable
  parent_execution_id: "nullable -- the previous execution of the same operation"

# Fields deliberately NOT present, and why.
excluded_fields:
  model_binding: no model execution occurs in this repository
  snapshot_identity: no model binding is instantiated
  gpu_or_accelerator: acquisition is I/O and parsing; there is no compute kernel to describe
  domain_method_block: no chemistry or simulation representation exists
  wall_clock: "timestamps are caller-supplied, matching RawDocument.retrieved_at and AcquisitionRequest.requested_at"

# Which acquisition events produce a record. Measured against the actual
# failure semantics of daf/scheduling/runner.py and the orchestrator.
event_coverage:
  plan_validation_failure: recorded
  unknown_source: recorded
  unknown_adapter: recorded
  adapter_failure: recorded
  malformed_source: recorded
  extraction_failure: recorded
  persistence_failure: recorded
  successful_acquisition: recorded
  duplicate_acquisition: recorded
  admission_rejection: "recorded, plus one quarantine record per refused admission"
  checkpoint_persistence_failure: "recorded as SUCCEEDED with the checkpoint error named, then the original exception is re-raised"

quarantine:
  record: daf/execution/quarantine.py
  identity:
    - execution_id
    - stage
    - errors
  references: execution_id
  is_not: the execution record
  retained: true
  repairable: false
  metrics: daf/execution/metrics.py
  gap: "retention and linkage exist; repair-and-re-ingest does not. What a repaired record looks like, and who may resubmit it, stays open."
  no_force_path: true

separation:
  rule: "artifact identity, artifact version identity, acquisition identity, execution identity, observation identity and evidence identity are six distinct identities"
  execution_record_may: reference them
  execution_record_may_not: redefine them
  enforcement: tests/test_execution_record.py

not_evidence:
  rule: "an execution record is metadata about an operation and is never measured, asserted, computed or derived evidence"
  mechanisms:
    - stored outside FilesystemEvidenceStore, in its own directory
    - never enters EvidencePool.fingerprint()
    - no evidence class is ever assigned to an execution id
    - nothing in daf/execution/ calls a pool mutator or an admission gate
  enforcement: tests/test_execution_record.py
