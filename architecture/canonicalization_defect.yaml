"applied":
  "byte_identity_preserved": "the serializer is byte-identical in both repositories after the change, verified by digest, which is what keeps the agreement meaningful."
  "digests_that_moved":
    - "architecture/exchange/canonicalization_fixture.yaml and .sha256 -- the agreement fixture itself"
    - "architecture/exchange/scl_requirements.yaml and .sha256 -- regenerated by its owner, mirrored here"
    - "architecture/exchange/daq_capabilities.yaml and .sha256"
    - "architecture/proposals/2026-08-25-daq-workload-proposal.yaml -- reissued against both new digests"
  "fix_is_emitter_side": "deliberately. A reader-side normalization would make an artifact's meaning depend on which reader opened it, which restates the defect rather than fixing it."
  "incidental_passes_now_pinned": "yes/no/on/off, null, ~, 007, 0o777, +5, 1_000, True and the empty string were passing via the old numeric-and-reserved-word checks rather than by any rule. They are pinned in the shared fixture now, because an incidental pass is the one that regresses silently when a parser is upgraded."
  "landed_as": "one commit per repository, the same change, so a future diff reads them as a pair rather than as drift"
  "the_half_landed_window_actually_opened":
    "enforcement": "architecture/exchange/verify_pair_landed.py, runnable in either repository"
    "how_to_verify": "compare `git rev-parse HEAD` against `git ls-remote origin <branch>` in EVERY repository in the pair. ls-remote asks the remote for state and cannot be satisfied by a stale local string."
    "the_general_shape": "a check that can report the wrong answer confidently is worse than no check. This is the same shape as asserting absence-of-violation rather than emptiness, and as a conformance test that has never failed: in each case the check's PREDICATE is not the property anyone cares about."
    "the_rule_this_encodes": "after any coordinated reissue, VERIFY BOTH REMOTES, NOT BOTH LOCALS. Local commits prove authorship; only the remote HEADs prove the pair landed together."
    "what_happened": "the SCL half reached its remote at 8220c21 while the DAQ half did not. For that window the two repositories disagreed on the encoding their SHARED agreement fixture pins: SCL's artifacts were re-emitted under always-quote and re-hashed, DAQ's were not, and the fixture digest recorded on each side named different bytes."
    "why_it_opened": "the push was reported as failed when it had succeeded. The check tested for a FAILURE STRING in command output rather than for the resulting STATE, and matched a stale `fatal` from earlier output -- reporting failure over a success, confidently."
  "verified": "all 17 trap scalars re-read through TWO independent parsers -- PyYAML and epistemics/_yaml.py -- and compared as TYPED VALUES: 0 divergences. The pre-fix bare emission was re-measured in the same session and diverges on ISO date, hex, sexagesimal and .inf, so the check is known to bite."
  "what_landed": "architecture/exchange/canonical_yaml.py now quotes every string unconditionally, values and keys alike. The conditional-quoting helpers were REMOVED rather than left beside the new rule -- they were the mechanism by which several traps passed incidentally, and leaving them would keep a second, weaker path a later edit could re-enable."
"artifact": "canonicalization_defect"
"blast_radius_if_applied":
  - "architecture/exchange/daq_capabilities.yaml -- re-emitted, new digest"
  - "architecture/exchange/scl_requirements.yaml -- owned upstream, re-emitted there, new digest"
  - "architecture/exchange/canonicalization_fixture.yaml and its .sha256 -- the agreement fixture itself changes"
  - "any proposal or decision record carrying either digest -- must be reissued, never edited in place"
"corrected_rule":
  "forbidden_scalars":
    - "`.inf`"
    - "`.nan`"
    - "sexagesimal"
    - "`0o`"
    - "`0x`"
    - "yes/no/on/off"
  "scalars": "implicit typing is forbidden -- every scalar is emitted with an explicit resolved type. Strings are double-quoted ALWAYS (not 'only where required'); numbers and booleans are emitted in canonical form and never as bare words that could resolve otherwise."
  "timestamps": "ISO-8601 strings, double-quoted, never native date/datetime"
  "verification": "round-trip through two independent parsers must yield identical TYPED STRUCTURES, not merely identical bytes. This is a required step of Phase 2, not an optional check."

  # THE DISCRIMINATOR. Added because the next person to hit an encoding
  # defect will reach for the rule above, and the rule above does not tell
  # them which half of it they are in. Two defects that look identical
  # from a distance take OPPOSITE repairs, and this phase hit both in the
  # same pass.
  "which_side_to_fix":
    "ask_first": "does a form exist that both sides read identically?"
    "if_no": "REFUSE AT THE WRITER. The bytes genuinely carry two meanings and no rendering escapes that, so the only fix is not to emit them. The scalar class -- a bare `2026-08-25` typed as str by one parser and date by another -- and the collection class -- a compact `- - 1` typed as a nested list by one reader and a string by the other -- are both here."
    "if_yes": "FIX THE SIDE THAT IS WRONG. The bytes have exactly one correct meaning under the spec and one reader is non-conformant. The escape class is here: the five escapes the emitter produces have one meaning under YAML 1.2, PyYAML already returned it, and the dependency-free reader simply did not decode them."
    "why_this_is_not_a_loophole": "the prohibition on reader-side repair is about RELOCATING an ambiguity. A reader that normalizes a correctly-parsed date back into a string leaves the bytes ambiguous for every OTHER reader and hides the defect behind one implementation. A reader that was failing to decode a well-defined escape had no ambiguity to relocate -- it was returning a wrong answer to a question with one right answer. Repairing it moves no artifact and no digest, which is itself the tell."
    "the_failure_mode_this_prevents": "reaching for 'always fix the emitter' without asking the question, which preserves a non-conformant reader behind a writer-side workaround and leaves every other consumer of that reader still wrong."
    "measured_basis": "both branches were exercised in one phase. The collection class had NO form both readers accept -- written long, the minimal reader raises where the compact form silently mistypes -- so refusal was the only emitter-side option. The escape class round-tripped correctly through PyYAML the entire time."
"extends": "core@1.0.0"
"fix_is_verified":
  "conclusion": "'strings always double-quoted' closes the entire measured class in one rule, including all six current divergences"
  "divergences_after": 0
  "method": "all 23 scalars re-emitted with strings unconditionally double-quoted, re-read by both parsers, compared as typed values"
"interim_mitigation": "until the coordinated change lands, no artifact authored here uses any scalar shape from the divergence list. tests/test_joint_decision_record.py enforces the date case directly, and tests/test_canonicalization_defect.py enforces the full class against every committed exchange and proposal artifact by comparing TYPED structures across both parsers."
"measured_failure_class":
  "already_safe_by_accident": "yes/no/on/off, null, ~, 007, +5, 1_000, 1.2, True and the empty string are already quoted by the current emitter's numeric-and-reserved-word checks. That they pass is incidental to those checks, not evidence that the class is closed -- 0o777 passes only because PyYAML's 1.1 resolver does not recognise the 0o form, and a 1.1-era emitter on the other side would resolve yes/no/on/off to bool."
  "divergences":
    - "emitted_bare": true
      "pyyaml": "datetime.date"
      "repo_reader": "str"
      "scalar": "`2026-08-25`"
    - "emitted_bare": true
      "pyyaml": "datetime.datetime"
      "repo_reader": "str"
      "scalar": "`2026-08-25T12:00:00Z`"
    - "emitted_bare": true
      "pyyaml": "int 5400 (sexagesimal)"
      "repo_reader": "str"
      "scalar": "`1:30:00`"
    - "emitted_bare": true
      "pyyaml": "int 31"
      "repo_reader": "str"
      "scalar": "`0x1F`"
    - "emitted_bare": true
      "pyyaml": "float inf"
      "repo_reader": "str"
      "scalar": "`.inf`"
    - "emitted_bare": true
      "pyyaml": "float nan"
      "repo_reader": "str"
      "scalar": "`.nan`"
  "method": "each scalar emitted through the shared architecture/exchange/canonical_yaml.py, then read back with BOTH parsers -- epistemics/_yaml.py (this repository's dependency-free reader) and PyYAML -- and compared as TYPED VALUES, not as bytes"
  "note_on_examples": "example scalars below are backtick-wrapped so that this document, which is ABOUT implicit-typing divergence, does not itself exhibit it under the very serializer it describes."
  "scalars_tested": 20
  "scalars_that_diverge": 6
"owner": "joint -- the serializer is byte-identical in both repositories by agreement"
"status": "corrected_applied_in_both_repositories"
"summary": "The pinned encoding's scalar rule is wrong, and the ISO-date divergence reported earlier is one instance of a class rather than the defect. YAML implicit type resolution means two conformant parsers can disagree on a scalar's TYPE while agreeing on the bytes -- so a byte-identical artifact can still hash-bind a different typed structure on each side. The original rule, 'strings double-quoted only where required by the spec', is the error. It should be: strings ALWAYS double-quoted."
"why_not_patched_here": "architecture/exchange/canonical_yaml.py is byte-identical to the compute layer's copy BY AGREEMENT, and that agreement is what makes either artifact's hash mean anything. Editing it on one side would break the agreement and silently re-hash every artifact already committed against it -- including architecture/exchange/daq_capabilities.yaml and the compute layer's own requirements artifact. The change must land in both repositories together, and every artifact and every hash reference must be reissued in the same coordinated step."

# ------------------------------------------- enforcement in BOTH suites --
#
# The fixture-agreement check proves the two encodings AGREE IN BEHAVIOUR,
# but only for the shapes the fixture covers, and only where both trees are
# present. It cannot see an edit that leaves the fixture's output unchanged
# -- a comment, a refactor, or behaviour for a shape the fixture does not
# exercise -- and those edits still make the two copies differ, which is
# exactly what byte-identity-by-agreement exists to prevent.
enforcement_in_both_suites:
  mechanism: "the serializer file's own SHA-256 is pinned, identically in both repositories, so either side's suite catches a local edit without needing the other tree present"
  authored_by: scl
  adopted_by_daq: "byte-identically -- the pin file, the digest sidecar and the cross-repo verifier were copied verbatim, not reimplemented. Reimplementing a check whose whole purpose is that both sides agree would restate the problem it solves."
  files:
    - architecture/exchange/canonical_yaml.sha256
    - architecture/exchange/verify_pair_landed.py
    - tests/test_shared_serializer_pin.py
  the_pin_is_a_second_line_not_a_replacement: "the fixture is what proves the two encodings agree in behaviour; the pin only proves the source has not drifted"
  never_the_right_fix: "updating the pinned digest alone. A legitimate serializer change is a COORDINATED REISSUE: change both repositories, regenerate every artifact, reissue every record carrying a digest, and confirm with verify_pair_landed.py that both REMOTES landed it."
  measured_ci_asymmetry: "the pin now runs in BOTH SUITES, but not in both CI paths, because there is only one CI path. Measured: this repository has .github/workflows/conformance.yml, which runs the full suite on every push; the compute layer's tree contains no CI configuration at all -- no .github, no workflow file, no Makefile, no tox or nox. So on that side the pin runs only when someone runs the suite. Recorded rather than fixed here: authoring CI for the other repository would mean shipping a workflow this session cannot verify passes, since that suite's conftest builds a native CMake target whose nlohmann_json dependency is absent from this container."
  measured_on: "2026-08-26"

# ==================== SECOND REISSUE: the classes ABOVE and BESIDE scalars ==
#
# The always-quote rule closed the ambiguity class among SCALARS and the
# record above says so. It did not close the class one level UP, among
# collections, and it did not close a third class beside it, among escape
# sequences -- which always-quote in fact WIDENED, since every string now
# passes through the quoting path. Both were measured after that fix
# landed. Recorded as a second reissue rather than folded into the first,
# because they moved a different set of digests and one of the two has the
# OPPOSITE repair.
second_reissue:
  "status": corrected_applied_in_both_repositories
  "date": "2026-08-26"

  "collection_class":
    "measured": "canonical_dump({'k': [['a'], ['b']]}) emitted the compact block form `- - \"a\"`. PyYAML types that as [['a'], ['b']]; epistemics/_yaml.py types it as the STRINGS ['- \"a\"', '- \"b\"']. Same bytes, same digest, two different values."
    "also_measured": "an empty collection nested in a sequence did not merely diverge -- the emitter CRASHED on it, raising `unsupported scalar type for canonical YAML: list` from the scalar formatter, because the nested-empty case fell through to the wrong branch."
    "repair": emitter_side_refusal
    "why_refusal_and_not_a_different_rendering": "there is no emitted form both readers accept. Written out long instead of collapsed, the minimal reader RAISES on the bare `-` rather than mistyping it. So the canonical answer is the one the scalar rule already took: refuse the ambiguous form at the writer."
    "why_not_reader_side": "teaching one reader to parse the compact form leaves the bytes ambiguous for every OTHER reader, including any third implementation. That is the argument that made the scalar fix emitter-side and it is unchanged here."
    "scope_of_the_refusal": "a sequence nested DIRECTLY in a sequence, and nothing else. A mapping in a sequence, a sequence in a mapping, and every depth of the two interleaved remain legal and are pinned in the fixture."
    "cost_measured": "zero. No committed artifact in either repository contained a nested sequence -- checked across every architecture/**/*.yaml on both sides -- so no artifact bytes changed."

  "escape_class":
    "measured": "the emitter's _quote escapes exactly five sequences (backslash, double quote, newline, carriage return, tab) and the always-quote rule sends EVERY string through it. epistemics/_yaml.py returned the quoted body verbatim via text[1:-1], decoding none of them, so 'he said \"x\"' came back with the backslashes still in it while PyYAML returned the intended string. Measured across 13 shapes: all 13 diverged."
    "repair": reader_side_conformance_fix
    "why_the_opposite_repair_is_correct_here": "this is NOT the ambiguity class. These bytes have exactly one correct meaning under YAML 1.2 and PyYAML already returns it; the minimal reader was simply non-conformant. Fixing a wrong reader is not the reader-side NORMALIZATION the scalar rule forbids -- that one coerced a correctly-parsed value back into a different type to hide ambiguous bytes. Distinguishing the two is the whole content of this entry."
    "blast_radius": "none. epistemics/_yaml.py is this repository's own reader, not a shared file. No artifact byte changed and no digest moved."
    "unknown_escapes_raise": "the decoder refuses any escape outside the five the canonical emitter can produce, rather than passing it through. An unrecognized escape means the document did not come from that emitter, and silently accepting it is how a subset parser stops being a subset parser."
    "it_reached_a_hash_bearing_artifact": "yes, and that is how it was found. The reissued joint decision record carried an escaped quote and parsed to two different values while the suite stayed green."

  "the_enforcement_hole_that_let_it_through":
    "what": "the two-parser typed-agreement check globbed architecture/exchange/*.yaml and architecture/proposals/*.yaml. architecture/decisions/ was not in the list."
    "consequence": "the one artifact type that binds a joint decision to its input hashes was never checked for two-parser agreement. The check existed and simply did not look there."
    "repair": "the directory is added AND the coverage rule is now asserted: every directory carrying a .sha256 sidecar must have its artifacts in the checked set. A hash-bearing directory left off a list is an unenforced guarantee."
    "enforcement": "tests/test_canonicalization_defect.py::test_every_directory_with_a_sha256_sidecar_is_covered_by_the_check"

  "blast_radius_measured_not_estimated":
    "moved": "canonical_yaml.py and its source pin; the agreement fixture and its sidecar; the joint decision record and its sidecar. Six files, in both repositories, one commit each."
    "did_not_move": "daq_capabilities.yaml, scl_requirements.yaml and both their sidecars. Verified by regenerating each from its own repository's committed generator: byte-identical output."
    "why_narrower_than_the_first_reissue": "the first reissue changed how every string is emitted, so every artifact was re-emitted and every digest moved. This one refuses a shape no artifact used and fixes a reader, so only the serializer, the fixture that pins it, and the record that binds the fixture hash moved."
    "why_the_decision_record_moved_at_all": "it binds canonicalization_fixture_hash, and its own binding_rule says a bound artifact changing means the record is REISSUED rather than edited. It was reissued: the decision itself is untouched, and the reissue block states what forced it."

  "the_pair_check_was_also_incomplete":
    "found": "verify_pair_landed.py's SHARED list named five files. It omitted the serializer's own source pin and the joint decision record, both byte-identical by agreement."
    "why_it_mattered": "a fixture change reissues the decision record, so a pair check that did not compare that record would have reported PAIR LANDED while the two repositories held different records. That is not hypothetical -- they HAD diverged once, when one clone was three commits stale and still held the pre-correction record."
    "repair": "the list is now eight files and is byte-identical across the pair."
