  "how_it_moved": "away from fourier_transform_1d because it is BUILT -- withdrawn on completion, not on merit -- and to convolution_1d, the only remaining in-scope candidate the rule admits. The re-measure also revealed that the rule's answer and the highest-leverage answer have come apart: least_squares carries more value and cannot be elected by DAQ alone."
