"artifact": "selection_rule_defect"
"corrected_in_the_same_phase":
  "found_by": "the compute layer, in the joint decision record that elected least_squares"
  "measured":
    - "kalman_filter_linear DAQ-owned blockers: structured_measurement_uncertainty, recursive_generation_depth"
    - "least_squares DAQ-owned blockers: stable_sample_and_variable_identity, explicit_missing_value_semantics"
    - "pca DAQ-owned blockers: stable_sample_and_variable_identity, commensurable_units_or_explicit_scaling"
  "the_correction": "the non-scalar quantity extension (covariance-bearing uncertainty) is required by Kalman and by NEITHER least_squares nor pca. What those two share is stable_sample_and_variable_identity -- an ALIGNED OBSERVATION TABLE with variable identity, which is a different extension from a covariance. Two extensions, two clusters: covariance unblocks Kalman alone; the observation table unblocks least_squares and pca."
  "what_survives": "the rule defect itself is unaffected and is if anything sharper. Both clusters are invisible to a rule that gates on satisfied-ness before consulting leverage, and least_squares is now the better illustration than Kalman: it is the highest-leverage candidate and is excluded by construction."
  "what_was_wrong": "this artifact claimed one extension clears the DAQ side of THREE workloads -- that the structured-uncertainty half unblocks Kalman and its other half carries least_squares and pca. That conflates two DIFFERENT extensions."
"extends": "core@1.0.0"
"owner": "joint -- the rule governs both repositories' shared gate"
"process_finding":
  "mitigations_not_yet_chosen":
    - "shorten gate latency so it is under the build latency of what it gates"
    - "re-measure the other repository's head as the FIRST step of writing any decision, not as reconnaissance done once at phase start"
    - "let a decision record name a commit it was measured against and refuse to bind when the head has moved -- the same discipline the artifact digests already enforce for content"
  "observable_symptom": "the joint decision record at 2026-08-26 selects fourier_transform_1d, which is already built. Its rationale reasons about generality falsification and validation quality as though choosing among unbuilt options. The reasoning is sound and the referent is stale."
  "summary": "the workload did not lose; the phase did"
  "what_happened": "the gate was designed to select an UNBUILT workload. While it was blocked on exchange artifacts and their canonicalization, the compute layer built fourier_transform_1d. By the time the gate could run, its intended winner was complete."
  "why_this_is_a_process_defect_not_an_accident": "nothing about the sequence was unusual. Reconnaissance, exchange, canonicalization repair and a decision record are all necessary, and their combined latency exceeded the time it took the other repository to build the thing being gated. A gate slower than the work it gates will be overtaken again, and the second time will look exactly like the first."
"proposed_correction":
  "not_yet_applied": "this is DAQ's finding about a rule both repositories share. Changing a joint selection rule is a joint act, and the same authorship constraint applies to it as to a decision record. Recorded for the next joint reissue, not applied unilaterally."
  "rule": "compare leverage-per-cost ACROSS BOTH BRANCHES rather than filtering to the already-satisfied set first. A blocked high-leverage workload may beat an unblocked low-leverage one when the unblocking extension is small."
  "superseded_by": "the joint decision record's reading, which is cleaner and reaches the same place: the rule's SECOND CLAUSE -- extend only for a named consuming workload -- is not an exception to the first, it is the repair. A workload blocked only by a capability gap is admissible when it names itself as the consumer of that gap's closure. Read that way the rule reaches least_squares; read as first-clause-only it cannot. That framing needs no new leverage-per-cost arithmetic."
  "what_changes": "satisfied-ness stops dominating leverage. It becomes a COST term -- zero for an already satisfied workload, the size of the extension otherwise -- instead of a filter applied before leverage is consulted."
  "what_stays":
    - "an extension still requires a named consuming workload -- that constraint was never the defect and is what stops speculative representation work"
    - "a workload whose requirements DAQ marks absent still cannot be selected WITHOUT the paired extension that supplies them"
"relationship_to_the_joint_decision_record": "this artifact does not overturn the compute layer's 2026-08-26 joint decision record, which is committed in its own repository and mirrored here. It records DAQ's measured position that the rule that record applied is defective and that the record's selected workload was already built when it was selected. Both are inputs to the next reissue, not unilateral corrections to a joint artifact."
"status": "corrected_in_the_joint_decision_record"
"re_measured_2026_08_27":
  "why_this_section_exists": "this artifact was found to be bound by NOTHING -- not a doctrine source, and named by no test -- so nothing anywhere would have noticed it going stale. It had. A defect record whose own headline evidence names an outcome that did not occur is worse than no record, because it is read as a measurement. Every falsifiable claim below is now re-measured against the tree by tests/test_selection_rule_defect.py, and the dated sentences are left in place beside the corrections rather than rewritten -- the same discipline the joint decision record applies to its own stale entries."
  "one_the_observable_symptom_names_an_outcome_that_did_not_occur":
    "the_dated_claim": "process_finding.observable_symptom: `the joint decision record at 2026-08-26 selects fourier_transform_1d, which is already built`."
    "measured": "the joint decision record's the_actual_choice.elected is option_b, which is least_squares. It never selected fourier_transform_1d. The record itself says fourier_transform_1d was `withdrawn ON COMPLETION, not on merit: recommending something already built is not a decision`."
    "what_survives": "the PROCESS finding is unaffected and is the durable half. A gate slower than the work it gates was overtaken -- fourier_transform_1d was built while the gate was blocked, and had to be withdrawn rather than ranked. The symptom was mis-stated as a selection when it was a withdrawal; the latency defect it evidences is real and is unchanged."
    "why_the_error_matters_anyway": "`selects` and `was overtaken and withdrew` are different failures with different repairs, and the sentence asserted the one that did not happen."
  "two_the_proposed_correction_is_applied_not_pending":
    "the_dated_claim": "proposed_correction.not_yet_applied: `Recorded for the next joint reissue, not applied unilaterally`."
    "measured": "the joint decision record carries the_rule_defect.the_correction with the same content -- the second clause is the repair, not an exception -- and ELECTED UNDER IT. option_b is chosen `under the rule's SECOND CLAUSE`. The correction was not merely proposed; it decided a workload."
    "what_is_still_open": "the rule TEXT has not been reissued. architecture/workload_primitive_matrix.yaml still reasons about `the joint rule's second clause` rather than about a rewritten rule, so a future reader applying the rule as written would reproduce the defect. Applied in a decision is not the same as repaired in the rule, and only the first has happened."
  "three_kalman_has_no_remaining_daq_blocker":
    "the_dated_claim": "`its one remaining blocker is structured_measurement_uncertainty`, and `recursive_generation_depth was SUPPLIED this phase: corrected from vacuously_enforced to represented_unenforced`."
    "measured": "BOTH of kalman_filter_linear's DAQ-owned blocking requirements are SATISFIED in architecture/exchange/scl_requirements.yaml at its pinned hash, each verified by SCL re-running the claims against DAQ's modules rather than reading DAQ's tests. generation_depth_bounded is ENFORCED in architecture/invariants.yaml, two corrections past the status this record names."
    "what_it_does_to_the_argument": "the sharpest_case_against_the_rule was built on Kalman having a small remaining extension that the rule could not reach. It has none. The case is not weakened into wrongness -- it was correct when made and the extension it argued for was in fact built -- but it can no longer be READ as a live example, because its subject is no longer blocked."
  "four_what_is_still_true": "the least_squares and pca blocker sets are exactly as corrected_in_the_same_phase records them: stable_sample_and_variable_identity plus explicit_missing_value_semantics for least_squares, stable_sample_and_variable_identity plus commensurable_units_or_explicit_scaling for pca, all four UNSATISFIED. The rule critique in why_it_is_backwards is an argument rather than a measurement and nothing here touches it."
  "and_one_thing_daq_has_not_reported": "DAQ built the aligned observation table (science/table.py, architecture/aligned_observation_table.yaml) and stable_sample_and_variable_identity is still UNSATISFIED in the requirements artifact. That status is SCL's to set -- the artifact says so explicitly of a different row -- and architecture/exchange/daq_requirement_response.yaml does not mention the requirement at all. So this is DAQ not having reported rather than SCL not having read. Named, not fixed here."
  "discharged_2026_08_27": "DAQ has now reported it, and three further rows with it: least_squares::stable_sample_and_variable_identity, pca::stable_sample_and_variable_identity, least_squares::explicit_missing_value_semantics and pca::commensurable_units_or_explicit_scaling are answered in the response artifact with evidence and with two measured LIMITS stated rather than omitted -- an in-range sentinel is admitted, and a scalar unit is not typed. The statuses remain SCL's to set and DAQ asserts none. The dated sentence above is kept because the test that discharged it was written against that sentence, and a discharged obligation whose original wording is deleted cannot be checked to have been the one discharged."
"summary": "The joint selection rule is miscalibrated, and this phase is the evidence rather than an argument for it. A rule that reliably prefers a near-zero-cost adjacent workload over the one that advances the substrate is not merely in tension with leverage; it is ordering on the wrong quantity."
"the_measured_instance":
  "admitted_by_the_rule": "convolution_1d"
  "excluded_by_the_rule":
    - "kalman_filter_linear"
    - "least_squares"
    - "pca"
  "what_the_exclusion_costs": "the entire linear-algebra family, which is the substrate's largest unexplored region and the one with the strongest primitive reuse"
  "why_it_is_marginal": "zero blocking requirements on either side, and adjacent to the transform that was just built -- it shares the reduction shape of the existing kernel and is implementable THROUGH the transform via the convolution theorem. It advances neither generality (the substrate has now been exercised by two families and convolution adds no third) nor reuse (its primitives are the ones already paid for)."
"the_rule_as_written": "select the highest-leverage workload whose observation requirements are ALREADY satisfied by DAQ, and extend DAQ only for a named consuming workload"
"the_sharpest_case_against_the_rule":
  "CORRECTED": "see corrected_in_the_same_phase. Kalman remains the only candidate with no compute-layer blocker, and its recursive_generation_depth blocker was still supplied this phase -- but it does NOT share its remaining extension with least_squares or pca."
  "and_the_same_extension_carries_two_more": "the other half, multivariate value with stable variable identity, is the shared DAQ blocker of BOTH least_squares and pca. So one extension clears the DAQ side of three workloads; Kalman needs nothing further, and the other two then need only the compute-layer linear-algebra family. That is a leverage argument the stale matrix could not produce and the current rule cannot act on."
  "measured":
    - "its blockers are BOTH DAQ-owned -- it is the only candidate with no compute-layer-side blocker at all, so no linear-algebra family has to be built for it to become admissible"
    - "one of its two blockers, recursive_generation_depth, was SUPPLIED this phase: generation_depth_bounded was corrected from vacuously_enforced to represented_unenforced with its semantic domain fixed to evidence lineage rather than iteration count"
    - "its one remaining blocker is structured_measurement_uncertainty"
    - "and that is exactly the half of the non-scalar extension DAQ's own coupling finding says must LEAD, because it is the silent half -- closing the multivariate half first converts a loud gate refusal into a silent late TypeError"
  "the_result": "the half of the extension that must go first for reasons internal to DAQ's own measured coupling is precisely the half that makes Kalman fully admissible. One extension half, one workload fully unblocked, and no compute-layer work required. The rule cannot see this, because Kalman is not in the already-satisfied set and the extension branch is a fallback it never reaches."
  "workload": "kalman_filter_linear"
"why_it_is_backwards":
  - "Satisfied-ness is a GATE and leverage is a TIE-BREAK. The rule filters to the already-satisfied set first and only ranks by leverage inside it, so a blocked high-leverage workload can never beat an unblocked low-leverage one no matter how small the unblocking extension is."
  - "The extension branch is a FALLBACK, reachable only when nothing at all is satisfied. So the rule cannot compare a small extension against a marginal already-satisfied option -- it never puts them on the same axis."
  - "The consequence is that the rule's answer degrades as the substrate improves: every workload built moves the frontier, leaving the already-satisfied set populated by whatever is adjacent to what was just done, which is by construction the option that generalizes least."
