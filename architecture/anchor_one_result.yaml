still_owed_and_not_by_this_session:
  a_replicate_anchor: "Injection # reads 1 and the field exists, so single injection is established structurally rather than inferred. The aggregate-row question -- whether Average / sigma / % RSD rows enter a pool as measurements -- remains untestable and is not answered from this anchor."
  a_second_party_on_the_transcription: "the raster tables were read by one reader. The cross-table check is what stands behind them and it is strong; it is not the same as a second reading."
  withheld: "still the one absence reason no fixture exercises. `Mv`'s empty cell is a real convention and it is not `withheld` -- nothing says the value was held back."

what_this_document_must_not_become: "a place where a prediction is edited after the fact. The three prediction artifacts are separate and pinned separately, and this one records what was measured against them."
