scope:
  build:
    - fourier_transform_1d
    - only the primitives it demonstrably requires
  do_not_build:
    - convolution_1d
    - kalman_filter_linear
    - least_squares
    - pca
    - pid_controller
    - viterbi
  note: "the universal gate is not a separate decision: fourier_transform_1d cannot cross the current protocol boundary at all without it, because input is decoded unconditionally as N x 24-byte particles and configuration is hard-fixed at 24 LJ-validated bytes."
  universal_gate_required_first:
    - W1 variable-length 1-D float64 array on the wire with an explicit shape
    - W4 generic configuration block
    - R1 a callable reduction
serializer_note: a bare ISO date is NOT used as a value anywhere in this record. The vendored canonical_yaml.py leaves 2026-08-25 unquoted, which PyYAML resolves to datetime.date while this repository's own reader returns str -- so such a value would have a parser-dependent hash. The serializer is byte-identical across both repositories by agreement and must not be edited on one side, so the field was removed instead. decision_id carries the date and is not date-shaped. Recorded as a measured gap in the shared serializer.
status: proposed
tradeoff_recorded:
  generality_falsification_argument: a substrate validated only through one MD kernel has not demonstrated that it generalises. A transform is deliberately orthogonal and carries independent analytic validation.
  resolution: the reuse argument is not rejected; it is unreachable today. Among reachable candidates the generality argument decides, and it selects fourier_transform_1d over convolution_correlation_1d.
  reuse_leverage_argument: "least_squares -> linear algebra -> Kalman -> PCA is the strongest primitive-reuse chain: 17 primitives buy 3 workloads (0.176 wl/prim) against 0.091 for least_squares alone. This argument LOSES here only because DAQ marks its entry modality absent -- it is deferred on availability, not on merit, and remains the strongest candidate the moment a multivariate source exists."
validation_requirements:
  - impulse input yields a flat magnitude spectrum
  - constant/DC input concentrates in the zero bin
  - a pure sinusoid at a bin-centre frequency yields energy in the expected bins
  - Parseval relation holds between time and frequency domains
  - inverse transform reconstructs the input within tolerance
  - no separately written transform implementation may be the sole oracle
what_would_make_this_a_decision:
  - a record committed where both artifact hashes can be verified against their ORIGIN repositories rather than against local copies
  - authored with write access to both sides, or by both sides
  - carrying the same two digests this proposal carries, or reissued digests if the canonicalization fix has landed by then
