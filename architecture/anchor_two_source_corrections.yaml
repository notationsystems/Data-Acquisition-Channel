  verdict: ALREADY MEASURED HERE, and the correction arrives after the fact
  what_happened: "this repository retrieved Anchor 2 directly on 2026-08-28 with a browser User-Agent and a regulations.gov Referer, recorded that the block was on the agent rather than the address, and hashed the result. The counterparty's `curl is 403-blocked, another route required` was carried in the record as a caveat that had already been resolved."
  the_check_that_closes_it: "both source files re-hashed against the copies held here. Byte-identical. The retrieval was sound and the caveat was stale rather than wrong."

