"authority":
  - "This is DAQ's PROPOSAL, not the joint decision. It is deliberately not a decision record."
  - "The joint decision is a two-party act. This session has WRITE access to the acquisition repository and READ-ONLY access to the compute layer, so a decision record written here would be one party writing both sides -- which defeats the exact property the record exists to provide, that a decision cannot be reconstructed from one agent's account of both repos."
  - "The decision record belongs where BOTH hashes can be verified against their origin repositories. This proposal carries DAQ's half: the capability measurement, the reading of the compute layer's published requirements, and the recommendation with its rationale."
"binding_rule": "the two hashes above bind this PROPOSAL to the exact measured artifacts that produced it. If either artifact changes -- including through the coordinated canonicalization fix recorded in architecture/canonicalization_defect.yaml, which re-hashes both -- this proposal must be reissued rather than edited."
"binding_rule_after_supersession": "this record is now HISTORY and takes no further reissue. Its capabilities_artifact_hash names the bytes it was actually written against, and it must NOT be rebound as that artifact moves: doing so would make a historical proposal claim to bind artifacts that did not exist when it was written, and would reissue a superseded record forever. Its hash is verified against the COMMITTED HISTORY of the artifact instead of against today's bytes -- which is a stronger check, since it proves the record bound something real at the time rather than merely matching now."
