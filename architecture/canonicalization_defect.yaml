      "scalar": "`2026-08-25T12:00:00Z`"
    - "emitted_bare": true
      "pyyaml": "int 5400 (sexagesimal)"
      "repo_reader": "str"
      "scalar": "`1:30:00`"
    - "emitted_bare": true
      "pyyaml": "int 31"
      "repo_reader": "str"
      "scalar": "`0x1F`"
    - "emitted_bare": true
