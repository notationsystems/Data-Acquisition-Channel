"applied":
  "byte_identity_preserved": "the serializer is byte-identical in both repositories after the change, verified by digest, which is what keeps the agreement meaningful."
  "digests_that_moved":
    - "architecture/exchange/canonicalization_fixture.yaml and .sha256 -- the agreement fixture itself"
    - "architecture/exchange/scl_requirements.yaml and .sha256 -- regenerated by its owner, mirrored here"
    - "architecture/exchange/daq_capabilities.yaml and .sha256"
    - "architecture/proposals/2026-08-25-daq-workload-proposal.yaml -- reissued against both new digests"
  "fix_is_emitter_side": "deliberately. A reader-side normalization would make an artifact's meaning depend on which reader opened it, which restates the defect rather than fixing it."
  "incidental_passes_now_pinned": "yes/no/on/off, null, ~, 007, 0o777, +5, 1_000, True and the empty string were passing via the old numeric-and-reserved-word checks rather than by any rule. They are pinned in the shared fixture now, because an incidental pass is the one that regresses silently when a parser is upgraded."
  "landed_as": "one commit per repository, the same change, so a future diff reads them as a pair rather than as drift"
  "the_half_landed_window_actually_opened":
    "enforcement": "architecture/exchange/verify_pair_landed.py, runnable in either repository"
    "how_to_verify": "compare `git rev-parse HEAD` against `git ls-remote origin <branch>` in EVERY repository in the pair. ls-remote asks the remote for state and cannot be satisfied by a stale local string."
    "the_general_shape": "a check that can report the wrong answer confidently is worse than no check. This is the same shape as asserting absence-of-violation rather than emptiness, and as a conformance test that has never failed: in each case the check's PREDICATE is not the property anyone cares about."
    "the_rule_this_encodes": "after any coordinated reissue, VERIFY BOTH REMOTES, NOT BOTH LOCALS. Local commits prove authorship; only the remote HEADs prove the pair landed together."
    "what_happened": "the SCL half reached its remote at 8220c21 while the DAQ half did not. For that window the two repositories disagreed on the encoding their SHARED agreement fixture pins: SCL's artifacts were re-emitted under always-quote and re-hashed, DAQ's were not, and the fixture digest recorded on each side named different bytes."
    "why_it_opened": "the push was reported as failed when it had succeeded. The check tested for a FAILURE STRING in command output rather than for the resulting STATE, and matched a stale `fatal` from earlier output -- reporting failure over a success, confidently."
  "verified": "all 17 trap scalars re-read through TWO independent parsers -- PyYAML and epistemics/_yaml.py -- and compared as TYPED VALUES: 0 divergences. The pre-fix bare emission was re-measured in the same session and diverges on ISO date, hex, sexagesimal and .inf, so the check is known to bite."
  "what_landed": "architecture/exchange/canonical_yaml.py now quotes every string unconditionally, values and keys alike. The conditional-quoting helpers were REMOVED rather than left beside the new rule -- they were the mechanism by which several traps passed incidentally, and leaving them would keep a second, weaker path a later edit could re-enable."
"artifact": "canonicalization_defect"
"blast_radius_if_applied":
  - "architecture/exchange/daq_capabilities.yaml -- re-emitted, new digest"
  - "architecture/exchange/scl_requirements.yaml -- owned upstream, re-emitted there, new digest"
  - "architecture/exchange/canonicalization_fixture.yaml and its .sha256 -- the agreement fixture itself changes"
  - "any proposal or decision record carrying either digest -- must be reissued, never edited in place"
"corrected_rule":
  "forbidden_scalars":
    - "`.inf`"
    - "`.nan`"
    - "sexagesimal"
    - "`0o`"
    - "`0x`"
    - "yes/no/on/off"
  "scalars": "implicit typing is forbidden -- every scalar is emitted with an explicit resolved type. Strings are double-quoted ALWAYS (not 'only where required'); numbers and booleans are emitted in canonical form and never as bare words that could resolve otherwise."
  "timestamps": "ISO-8601 strings, double-quoted, never native date/datetime"
  "verification": "round-trip through two independent parsers must yield identical TYPED STRUCTURES, not merely identical bytes. This is a required step of Phase 2, not an optional check."
"extends": "core@1.0.0"
"fix_is_verified":
  "conclusion": "'strings always double-quoted' closes the entire measured class in one rule, including all six current divergences"
  "divergences_after": 0
  "method": "all 23 scalars re-emitted with strings unconditionally double-quoted, re-read by both parsers, compared as typed values"
"interim_mitigation": "until the coordinated change lands, no artifact authored here uses any scalar shape from the divergence list. tests/test_joint_decision_record.py enforces the date case directly, and tests/test_canonicalization_defect.py enforces the full class against every committed exchange and proposal artifact by comparing TYPED structures across both parsers."
"measured_failure_class":
  "already_safe_by_accident": "yes/no/on/off, null, ~, 007, +5, 1_000, 1.2, True and the empty string are already quoted by the current emitter's numeric-and-reserved-word checks. That they pass is incidental to those checks, not evidence that the class is closed -- 0o777 passes only because PyYAML's 1.1 resolver does not recognise the 0o form, and a 1.1-era emitter on the other side would resolve yes/no/on/off to bool."
  "divergences":
    - "emitted_bare": true
