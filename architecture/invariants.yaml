# The invariant set, with its ACTUAL enforcement status in this
# repository. Every status below was established by inspection or by a
# test that runs; none is aspirational.
#
# STATUS VOCABULARY -- the distinctions are load-bearing:
#   enforced               a test fails today if the invariant is broken
#   vacuously_enforced     the check runs and passes because the thing it
#                          constrains does not exist here yet; it fails
#                          the moment one appears
#   partially_enforced     a mechanism exists but nothing compels callers
#   represented_unenforced the concept is represented in data; no check
#   blocked                not implementable without inventing repository
#                          state; the blocker is named
#   absent                 neither represented nor enforced
extends: core@1.0.0

invariants:

  # ---- Epistemic write path. The highest priority set: these close
  # ---- paths that become expensive to repair after records exist.

  - id: class_assigned_at_ingest
    rule: "every evidence object's class is fixed in the same call that admits it, and there is no reclassification path"
    status: enforced
    implementation: epistemics/evidence_class.py, daf/storage/classified_pool.py
    enforcement: tests/test_epistemic_boundary.py
    mechanisms:
      - "frozen dataclass and ClassRegister.assign refuse a differing second class"
      - "class participates in content_hash, so in-place edit re-hashes and is refused on load"
      - "append-only store means a wholesale rewrite leaves two assignments, caught at restore"
    limitation: "detects alteration, not an adversary with delete access to the store"
    failure_mode: fail_closed

  - id: proposals_are_not_evidence
    rule: "no derived state, model proposal, optimizer output or agent interpretation writes itself into evidence or canonical state"
    status: enforced
    implementation: epistemics/evidence_class.py, architecture/control_graph.yaml
    enforcement: tests/test_epistemic_boundary.py
    mechanisms:
      - "AST: only scout/pipeline.py and materials/results.py call a pool mutator; science, bridge, boundary, epistemics call none"
      - "class: derived_value and derived_grounding may only be computed or derived, never measured or asserted"
      - "graph: derived_state has exactly one exit, and it is acquisition"
    failure_mode: fail_closed

  - id: provenance_total
    rule: "every evidence object traces to a Source through content-addressed ids"
    status: enforced
    implementation: vendor evidence/types.py identity chain
    enforcement: tests/test_epistemic_boundary.py
    note: "already true before this phase; measured here on real acquired NOAA and graph-dataset evidence rather than argued"

  - id: core_schema_closed
    rule: "a canonical state may not carry a field the active schema does not declare"
    status: enforced
    implementation: vendor core/canonical/validation.py
    enforcement: vendor/scout-retrieval-agent/tests/test_canonical.py
    evidence: "UNKNOWN_FIELD error code at core/canonical/validation.py:65"
    note: "already enforced by the core; this phase verified it rather than reimplementing it"

  - id: metric_before_optimization
    rule: "no optimizer runs against a metric the system cannot compute"
    status: enforced
    implementation: vendor materials/value.py
    enforcement: tests/test_epistemic_boundary.py
    evidence: "expected_information_gain is the literal NOT_DETERMINABLE at materials/value.py:229; no optimizer exists"

  - id: prediction_carries_uncertainty
    rule: "a numeric value carries unit, uncertainty and uncertainty_kind; absent is an explicit kind"
    status: partially_enforced
    implementation: science/admissibility.py
    enforcement: tests/test_addendum_invariants.py
    gap: "the validators exist and are pure; nothing in the acquisition path is compelled to call them, because ingest is the vendored run_scout"

  - id: training_admissibility_declared
    rule: "which evidence classes may train a model is declared, not assumed"
    status: represented_unenforced
    implementation: "architecture/evidence_class.yaml class_admissibility, epistemics ClassRegister.admissible_for_training"
    enforcement: tests/test_epistemic_boundary.py
    note: "no training exists in this repository; the declaration is enforced, its consumption cannot be"

  - id: no_circular_training
    rule: "model output never becomes training input for the model that produced it"
    status: vacuously_enforced
    enforcement: tests/test_epistemic_boundary.py
    evidence: "no training loop, no model fitting and no gradient step exists in daf, science, boundary, bridge or epistemics"

  - id: generation_depth_bounded
    rule: "derivation from derivation is bounded and the depth is recorded"
    status: represented_unenforced
    enforcement: tests/test_recursive_lineage_depth.py
    evidence: "CORRECTED 2026-08-25 by architecture/_probes/generality.yaml's recursive_computation FAIL. The previous evidence line -- 'DerivedValue identity makes a derivation cycle unconstructible; no generative path exists to bound' -- was true in its first clause and did not support the rule. Acyclicity is not boundedness. MEASURED: no depth/generation/lineage symbol is defined anywhere in this repository or its vendored substrate; DerivedValue's fields are exactly (id, derived_from, method, content, confidence, derived_at), with no depth; this invariant declares no bound value; and evidence.provenance.ancestry_of returns a flat set union that discards the level at which each node was reached. So neither clause of the rule is implemented: nothing is bounded and no depth is recorded. The rule is retained UNCHANGED and its status corrected downward, because the rule is right and the claim to enforce it was wrong. What is enforced today is only the narrower fact the tests can establish: no derivation-from-derivation chain is constructible through any shipped path, so the unbounded case cannot yet arise here."
    corrected_semantic_domain: "depth is EVIDENCE LINEAGE depth, never computation iteration count. A recursive estimator running N iterations over one measurement stream is one lineage step, not N. A recursive computation must carry stream_identity, window_or_horizon and initialization_provenance (measured | computed(prior_id)); where initialization derives from a computed prior, lineage depth inherits from that prior."
    owner_of_the_recursive_case: "SCL owns computation identity and STE owns execution identity; DAQ owns only the evidence-lineage semantics stated here. See architecture/decisions/2026-08-25-workload-selection.yaml -- the selected workload (fourier_transform_1d) is NOT recursive, so no recursive computation exists to bound today."

  # ---- Control substrate.

  - id: acquisition_first_control_loop
    rule: "the substrate is a loop entered at acquisition, not a stack entered at evidence"
    status: enforced
    implementation: epistemics/control_graph.py, architecture/control_graph.yaml
    enforcement: tests/test_epistemic_boundary.py

  - id: return_edge_is_exclusive
    rule: "derived state re-enters the substrate only through acquisition"
    status: enforced
    implementation: epistemics/control_graph.py
    enforcement: tests/test_epistemic_boundary.py

  - id: execution_recorded
    rule: "every execution is recorded even when it cannot be re-run"
    status: enforced
    implementation: daf/execution/
    enforcement: tests/test_execution_record.py
    contract: architecture/execution_record.yaml
    scope: daf_acquisition_only
    note: "Phase 26. Every acquisition outcome produces a record, including runs that fail before an adapter is resolved"

  - id: execution_is_not_evidence
    rule: "an execution record describes an operation and is never admitted as evidence of any class"
    status: enforced
    implementation: daf/execution/store.py
    enforcement: tests/test_execution_record.py
    mechanisms:
      - "stored outside FilesystemEvidenceStore, so EvidencePool.fingerprint() is unchanged by recording a run"
      - "no evidence class is ever assigned to an execution id"
      - "AST: nothing in daf/execution/ calls a pool mutator or an admission gate"

  - id: execution_identity_is_separate
    rule: "execution identity is distinct from operation, artifact, version, observation and evidence identity, and execution metadata never reaches artifact identity"
    status: enforced
    implementation: daf/execution/identity.py
    enforcement: tests/test_execution_record.py
    note: "measured: two runs in different runtimes at different times produce different execution ids and byte-identical artifact and version ids"

  - id: rejection_rate_is_a_metric
    rule: "the rejection rate per invariant is computed per ingest run, over admission attempts only"
    status: enforced
    implementation: daf/execution/metrics.py
    enforcement: tests/test_ingest_metrics.py
    measured: "a run of four dataset records produced 3 accepted, 1 terminal refusal and 1 partial refusal; the terminal rate is 0.25 while refusals-over-refusals-plus-accepted would report 0.40"
    accounting:
      terminal_stages: "document, extraction, observation, record -- the candidate did not enter; these form the denominator"
      partial_stages: "referent, relationship -- the observation entered anyway; counted, never folded into the rate"
    absence: "a run that attempted nothing has no rejection rate, not a rate of zero"
    derived_view: "no identity, never persisted, recomputable from records already on disk"

  - id: refusal_reachability_declared
    rule: "every refusal code the pipeline can emit carries a declared reachability verdict, and a rate of zero is evidence about source quality only for a code whose verdict is REACHABLE"
    status: enforced
    implementation: architecture/admission_reachability.yaml
    enforcement: tests/test_admission_reachability.py
    rationale: "a zero rate means two different things -- the gate was reached and did not fire, or no acquisition path can reach it. Without the verdict the metric reads as clean data when it is silent."
    drift_guard: "the declared code set is checked against the codes the vendored admission gates and pipeline actually emit, so a new upstream code cannot go silently unclassified"

  - id: unclassified_backlog_is_a_metric
    rule: "the unclassified count is reported per evidence category, from the durable store"
    status: enforced
    implementation: daf/execution/metrics.py
    enforcement: tests/test_ingest_metrics.py
    note: "counted from disk rather than from an in-memory pool, so a corpus persisted before class_assigned_at_ingest existed is reported as wholly unclassified"

  - id: failed_execution_retained
    rule: "an execution that begins and fails stays auditable, with no manufactured output fingerprint"
    status: enforced
    implementation: daf/execution/recorded.py
    enforcement: tests/test_execution_record.py
    note: "the execution id is minted before the run starts, so a plan that fails validation still has one"

  # ---- Doctrine generation.

  - id: doctrine_source_is_canonical
    rule: "architectural state lives in architecture/*.yaml; doctrine is a projection of it"
    status: enforced
    implementation: epistemics/doctrine.py
    enforcement: tests/test_doctrine_generation.py

  - id: doctrine_regeneration_is_deterministic
    rule: "generating twice from the same canonical sources produces byte-identical doctrine"
    status: enforced
    enforcement: tests/test_doctrine_generation.py

  - id: generated_doctrine_matches_source
    rule: "the committed generated doctrine equals what regeneration produces; a non-zero diff fails closed"
    status: enforced
    enforcement: tests/test_doctrine_generation.py

  - id: manual_generated_doctrine_changes_fail
    rule: "editing generated doctrine by hand is not an accepted workflow and is detected"
    status: enforced
    enforcement: tests/test_doctrine_generation.py

  - id: doctrine_budget_enforced
    rule: "generated doctrine exceeding its committed budget fails closed and the overflow is named"
    status: enforced
    implementation: epistemics/doctrine.py
    enforcement: tests/test_doctrine_generation.py

  - id: no_vendor_in_doctrine
    rule: "vendor names, model identifiers and provider-specific syntax never appear in doctrine"
    status: enforced
    implementation: epistemics/doctrine.py
    enforcement: tests/test_doctrine_generation.py
    note: "non-vacuous: doctrine exists and is linted; it happens also to be true that no vendor name appears anywhere in the repository"

  # ---- Model binding. Every one of these is blocked by the same fact.

  - id: cross_vendor_validation
    rule: "the accepting binding's vendor differs from every proposing binding's vendor"
    status: vacuously_enforced
    implementation: epistemics/model_binding.py
    enforcement: tests/test_doctrine_generation.py
    evidence: "architecture/model_binding.yaml declares bindings {}"

  - id: no_self_validation
    rule: "a binding may not validate a proposal it authored"
    status: vacuously_enforced
    implementation: epistemics/model_binding.py
    enforcement: tests/test_doctrine_generation.py

  - id: builder_check_lineage_recorded
    rule: "every enforcement validator records its authoring binding; shared vendor with the constrained lineage requires an explicit review record"
    status: vacuously_enforced
    implementation: epistemics/model_binding.py
    enforcement: tests/test_doctrine_generation.py
    unresolved: "whether that review record must itself be cross-vendor"

  - id: pin_accepted
    rule: "the pinned model identifier is accepted and available at startup"
    status: blocked
    blocked_by: "no model binding is instantiated in this repository"

  - id: behavioral_canary
    rule: "fixed fixtures at temperature zero, scored on structured fields against a committed noise floor and threshold"
    status: blocked
    blocked_by: "no model binding is instantiated in this repository"
    explicitly_not_implemented_as: "comparing a requested model string with an echoed response, which verifies nothing about served weights"

  - id: attested_snapshot_identity
    rule: "the served weights are attestable"
    status: blocked
    blocked_by: "no vendor exposes an attestable snapshot digest, and no open-weights binding is instantiated"

  - id: agent_concurrence_is_not_corroboration
    rule: "two agents agreeing is not two pieces of evidence"
    status: vacuously_enforced
    enforcement: tests/test_epistemic_boundary.py
    evidence: "no agent execution exists; corroboration in this repository is always two Records"

  # ---- Chemistry vertical. Deferred by the synchronization prompt's own
  # ---- ordering: the generator path lands before domain expansion.

  - id: quantity_is_typed
    rule: "every numeric value carries unit, uncertainty and uncertainty_kind"
    status: partially_enforced
    implementation: science/admissibility.py
    enforcement: tests/test_addendum_invariants.py
    gap: "not wired into any admission path"

  - id: no_context_free_property
    rule: "a property value is inadmissible without method, conditions and a typed quantity"
    status: partially_enforced
    implementation: science/admissibility.py
    enforcement: tests/test_addendum_invariants.py
    gap: "not wired into any admission path"

  - id: absence_is_never_an_in_range_value
    rule: "a missing value is expressed structurally and never as a number; no member of the numeric range, NaN and the infinities included, may mean absent"
    status: enforced
    implementation: science/admissibility.py, science/table.py, daf/extractors/_passthrough.py, daf/storage/filesystem_store.py
    enforcement: tests/test_aligned_observation_table.py
    fourth_instance_of: "uncertainty_kind absent, the Fourier metrics DAQ refuses to fabricate, delta-t as a sentinel, and now a missing table cell. The rule is identical in all four and is stated once here."
    mechanisms:
      - "science/admissibility.py refuses NON_FINITE_QUANTITY and NON_FINITE_UNCERTAINTY. Measured before the fix: NaN, +inf and -inf were ALL admissible through the full property gate, because they are instances of float and every isinstance check passed them."
      - "science/table.py refuses SENTINEL_ENCODED_ABSENCE and requires a stated value_absence reason from a closed vocabulary"
      - "daf/extractors/_passthrough.py refuses a non-finite number at any nesting depth on both verbatim pass-through routes, which were the paths that reached no gate"
    measured_consequence_if_unenforced: "content_hash emits a bare NaN token, which is not valid strict JSON, so Observation.id is computed over bytes no conformant reader in another language accepts; the literal persists to disk; and the value does not compare equal to itself after a round trip, so an equality check that would catch a corrupted round trip returns False for an intact one"
    limitation: "enforced where an aligned table is gated and where the two pass-through extractors read. A source-specific extractor that constructs content by hand is separately responsible; the seam covers the generic transports, not every author."
    failure_mode: fail_closed

  - id: emitted_json_is_json
    rule: "no DAF-owned writer emits a token its own format does not define; a non-finite number is refused at the write rather than serialized as a bare NaN or Infinity"
    status: enforced
    implementation: daf/storage/filesystem_store.py and every other DAF-owned json.dumps
    enforcement: tests/test_aligned_observation_table.py
    measured_before: "json.dumps defaults to allow_nan=True, which emits bare NaN/Infinity -- a Python extension, not JSON. The store wrote that literal, so a file claiming to be JSON was not, and no conformant reader in another language would accept it."
    it_is_the_fourth_instance_of_one_rule: "a writer emitting a form its own reader cannot accept. Clause 2; the YAML implicit-typing defect; the YAML collection and escape classes; and this."
    the_rule: "canonical at the WRITER, refuse the ambiguous form. A reader taught to tolerate the form relocates the problem to every other reader, including the ones in other languages the format exists to reach."
    enforced_tree_wide: "checked over every json.dumps under daf/, not one call at a time, so a new writer added without it fails here rather than at whichever consumer first reads the file back"
    bounded_limitation: "evidence.identity.content_hash is vendored and uses the permissive default, so id MINTING cannot be made to refuse. DAQ closes every route it owns instead; an Observation built directly in memory with a NaN still gets an id over invalid JSON, and that residue is recorded rather than hidden."
    failure_mode: fail_closed

  - id: a_bool_is_not_a_quantity
    rule: "a boolean is refused wherever a measured magnitude is read -- as a quantity, as an uncertainty, and as a table cell"
    status: enforced
    implementation: science/admissibility.py, science/table.py
    enforcement: tests/test_aligned_observation_table.py
    why_it_needs_saying: "isinstance(True, int) is True in Python, so a bool passes every numeric check that does not exclude it BY NAME. Measured: a bool was already refused as a quantity but was ADMISSIBLE as an uncertainty and ADMISSIBLE as a table cell."
    the_harm_is_silent: "sum([True, True, False]) is 2, so a bool column becomes a count nobody asserted. Nothing raises."
    it_is_also_a_modelling_boundary: "if the source means an indicator, encoding it as 0/1 is a design-matrix decision, and the requirements artifact records the choice of design matrix as a modelling assertion rather than an observation. Letting True arrive where a number is read makes that choice silently."
    inherited_by: "the covariance extension -- a covariance is a matrix of cells, and a bool in one passes a positive-semidefinite check while meaning nothing"
    failure_mode: fail_closed

  - id: table_identity_is_typed_not_positional
    rule: "an observation joined into an aligned table carries a non-empty string sample identity and a non-empty string variable identity; row position is not an identity"
    status: partially_enforced
    implementation: science/table.py
    enforcement: tests/test_aligned_observation_table.py
    gap: "not wired into any admission path -- like quantity_is_typed and no_context_free_property, it is a gate the scientific layer applies to already-admitted evidence, not an ingest check"
    element_types_not_presence: "the same asymmetry recorded in the section 7 / section 8 finding: a value refused at the gate fails loudly and early, one admitted and failing at a consumer fails silently and late. An int sample id and the str form of the same number are different join keys, so a partially-typed table splits in two and the fit runs over half its rows with healthy-looking residuals."
    named_consuming_workload: "least_squares, per architecture/aligned_observation_table.yaml"

  - id: identity_policy_declared
    rule: "substance-level merge requires an explicit resolution policy on both records"
    status: absent
    gap: "no chemistry representation exists in this repository at all"

  - id: no_point_identity_for_distributions
    rule: "distribution-kind entities identified only by a structure string are inadmissible"
    status: absent
    gap: "no chemistry representation exists in this repository at all"

  - id: computed_fully_specified
    rule: "computed evidence missing its domain method block is inadmissible for canonical assertion"
    status: absent
    gap: "no chemistry representation exists in this repository at all"

  - id: applicability_domain_declared
    rule: "a prediction outside its declared applicability domain is flagged and inadmissible"
    status: absent
    gap: "no chemistry representation exists in this repository at all"

# §9 append-only and retraction. Recorded as a gap, deliberately NOT built.
retraction:
  status: absent
  detail: "FilesystemEvidenceStore is append-only and content-addressed and has no delete method; no tombstone, supersession or retraction path exists for any evidence type"
  consequence: "a source compelling removal would require deleting content-addressed blobs that materials ModelState Sample.observation_id still references, orphaning scientific state"
  probe: "architecture/_probes/generality.yaml revocable_record"
  not_built_because: "the synchronization prompt directs recording the gap, not building the retraction system"

# §22 migration. INSPECTED: no EvidencePool records are committed to this
# repository; every pool is constructed per-run against a temporary root.
migration:
  legacy_class: unclassified
  committed_records_in_repository: 0
  inspected_on: "2026-08-25"
  rules:
    - unclassified records remain readable and retrievable
    - unclassified records are inadmissible for canonical assertion
    - unclassified records are inadmissible for model training
    - classification produces a new record with provenance
    - legacy records are never mutated
    - unclassified count is a reported metric
  forbidden:
    - a bypass flag admitting unclassified records
    - bulk auto-classification by inference
  note: "any pool persisted before this phase has zero class assignments on disk and is therefore wholly unclassified by construction, which is the correct answer rather than a migration to run"

# §23 rejection policy. Represented; the quarantine store is NOT built.
rejection_policy:
  status: partially_enforced
  existing_mechanism: "scout.pipeline.ScoutAdmissionFailure retains stage and errors for every refused admission and is returned to the caller"
  implementation: daf/execution/quarantine.py, daf/execution/store.py
  enforcement: tests/test_execution_record.py
  closed_in_phase_26: "rejections are now RETAINED in a durable, queryable, tamper-evident store, each linked to the execution that produced it"
  gap: "repair-and-re-ingest does not exist. What a repaired record looks like, and who may resubmit it, remains open."
  measurement_gap: "measured in Phase 28: of 15 refusal codes, 2 are reachable from a shipped binding and exercised, 7 are structurally unreachable through the vendored pipeline, 4 are adapter-unreachable and 2 are extractor-defect-only. See architecture/admission_reachability.yaml."
  rejection_rate_per_invariant: "computed per run by daf/execution/metrics.py, per (stage, code), over admission attempts only"
  closed_in_phase_27: "rejection rate per invariant and the unclassified backlog are reported together as one ingest report"
  no_force_path: true
  no_force_path_evidence: "no bypass argument exists on any admit_* or put_* in this repository"

unresolved:
  - id: multi_writer.write_conflict
    detail: "merge policy for concurrent canonical assertions"
  - id: builder_check_lineage
    detail: "whether enforcement-code review must itself be cross-vendor"
  - id: attested_snapshot_identity
    detail: "unavailable for hosted bindings; no binding exists here to attest"
  - id: capabilities_5_to_9
    detail: "acceptance criteria still required before self-optimization"
  - id: retraction_semantics
    detail: "no path removes an admitted Observation without orphaning scientific state"
  - id: quarantine_repair
    detail: "refusals are retained and counted; what a repaired record looks like, and who may resubmit it, is open"
  - id: unreachable_refusal_stages
    detail: "11 of 15 refusal codes cannot be produced by any shipped binding. 7 are structurally unreachable through the unmodified vendored pipeline and can never be exercised; the other 4 would become reachable only if an adapter or extractor changed. Corrected and measured in Phase 28 -- the earlier statement of this item named the wrong stages."
