      reason: the capability artifact gained measured content after this record was first issued, so its recorded hash no longer bound to the bytes on disk -- caught by test_the_recorded_hashes_bind_to_the_bytes_on_disk, which is the guarantee this record exists to provide. Reissued rather than edited, per binding_rule.
      recommended: fourier_transform_1d
  reason: the primitive matrix was rebuilt against the current compute-layer commit 5447df3 rather than the stale edfc2dc it was first measured at. The re-measure moved the recommendation, which is the outcome a re-measure is for.
  what_did_not_change: DAQ's capability measurement, its gate-A answer for the ordered-1d modality, and the requirements mirror. Only the compute-layer side of the matrix was stale.
requirements_artifact: architecture/exchange/scl_requirements.yaml
requirements_artifact_authority:
  - READ-ONLY MIRROR. The origin is notationsystems/Scientific-Compute-Layer-SCL- architecture/exchange/scl_requirements.yaml at commit 5447df3.
  - The copy held here is byte-identical to those committed bytes and hashes to the digest recorded in the ORIGIN repository's own scl_requirements.sha256 sidecar. Because both of those hold, it IS the compute layer's own emission rather than this repository's account of it, and the proposal may reference its hash directly.
  - What the sidecar and the byte check protect against is a future session REGENERATING it locally and not noticing. That is why it is labelled a mirror with the upstream digest recorded, rather than left to look like an artifact this repository owns.
