what_this_record_must_not_become:
  the_risk: "a claim of ecosystem coherence resting on four quoted sentences and a grep."
  the_scope_restated: "three branches of twelve, in one repository of three carrying Codex work, read once on 2026-09-03 at the shas recorded above. Every alignment above is a quotation from an artifact at a named sha, and every divergence is a measurement that can be re-run."
  what_would_change_the_verdict: "reading the nine unread BIM branches; any of them may carry an uncertainty vocabulary this one does not, in which case the divergence above is narrower than stated and this record is the thing that gets corrected."
