artifact: workload_primitive_matrix
compute_layer_reported_not_verified_here:
  attribution: "reported by the compute layer. NOT re-derived in this repository: the native build cannot run on this host. Recorded with attribution rather than as a DAQ measurement."
  fourier_validation: 40 of 40
  suite: 203 passing
extends: core@1.0.0
how_the_leverage_argument_shifted:
  - The old matrix's central claim was a universal gate -- a variable-length array on the wire, a generic configuration block, an operation-generic result -- that unblocked zero workloads by itself and behind which everything sat. That gate is now BUILT. Its cost has already been paid by the compute layer, and it is no longer a term in any candidate's cost.
  - "The old matrix scored fourier_transform_1d at 9 of 10 primitives needing new code. That was true of edfc2dc. It is now BUILT, so it cannot be recommended: a recommendation to build something that exists is not a decision."
  - convolution_1d was scored second-cheapest in the old matrix at 6 primitives. Re-measured, the compute layer records ZERO blocking requirements for it on either side -- the wire layer it needed is built, and the transform gives it a second implementation strategy via the convolution theorem. It is now the only fully unblocked candidate that is also in scope.
  - "The reuse-leverage chain (least_squares to linear algebra to Kalman to PCA) is UNCHANGED in its arithmetic and unchanged in being blocked. What changed is the shape of the blockage: least_squares is now the only candidate whose blockers split across both repositories, which makes it the natural subject of the joint rule's second clause -- the smallest DAQ extension that unblocks the highest-leverage justified workload."
  - "So the re-measure does move the answer, and it moves it twice: away from fourier_transform_1d because it is done, and toward a genuine choice between convolution_1d (zero blockers, low marginal value now that the transform exists) and a paired least_squares extension (high leverage, requires a DAQ representation change). That choice is not made here."
measured_against:
  compute_layer_commit: 5447df3
  intervening_commits:
    - e49828b -- generalized the operation boundary, added fourier_transform_1d
    - 0bb3e66 -- Phase 1 recon and the Phase 2 exchange artifact
    - 5447df3 -- stated the operation contract, generalized the annotating-parameter rule
  previous_measurement_commit: edfc2dc
  what_daq_can_and_cannot_measure_here: "STRUCTURE is measurable from this repository: source files, the registry table, type signatures, the wire layout, and the test count via collection. BEHAVIOUR is not: the native build needs nlohmann_json, which is absent on this host, so the compute layer's suite errors at its build fixture here. Every behavioural figure below is attributed to the compute layer's own report and is NOT re-derived here. Cross-repository measurement without the build is exactly where a confident wrong number enters."
