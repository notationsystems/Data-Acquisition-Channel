# Whether a shipped extractor's discarded-or-carried source fields
# constitute genuine method provenance for the property-admissibility
# gate (`science.admissibility.no_context_free_property`'s `method`
# requirement) -- determined by inspection and real acquisition, never
# assumed from a field name.
#
# THIS FILE RECORDS DETERMINATIONS, NOT A SCHEMA. Each source gets one
# verdict, evidenced by the actual field values a real acquisition
# produced. A verdict of `document_classification` or
# `contextual_metadata` is not a gap to close by promotion; it is the
# honest answer.
extends: core@1.0.0

verdicts:
  legitimate_method_provenance: "the field names how a measurement, computation, or simulation was performed, and can supply science.admissibility's method requirement without reinterpretation"
  document_classification: "the field classifies what kind of document was filed or produced, not how any measurement was performed"
  contextual_metadata: "the field is real acquisition or administrative context, but names neither a method nor a measurement"
  not_property_shaped: "the source's Observation.content has no property/value pair at all; the method question does not arise because there is no property assertion for a method to attach to"

determinations:

  edgar_daily_index_form_type:
    field: "filings[].form_type and form_type_counts, daf/extractors/edgar_daily_index.py"
    correction: "docs/PHASE_29_LIVE_PROPERTY_INGEST_INTEGRATION.md's next-frontier section claimed this field is already present in the raw .idx row but currently discarded. That is factually wrong, measured directly: the extractor already parses form_type per filing and aggregates it into form_type_counts, and both are present in every acquired Observation's content today. Nothing here was ever discarded."
    real_values_observed:
      - "10-K"
      - "8-K"
      - "8-K/A"
      - "S-1"
      - "424B3"
      - "D"
    semantic_classification: document_classification
    classification_evidence: "every observed value is an SEC regulatory filing-type code (17 CFR 240/249): 10-K is an annual report, 8-K a current report of a material event, 8-K/A an amendment to one, S-1 an IPO registration statement, 424B3 a prospectus filed under Rule 424(b)(3), D a Regulation D exempt-offering notice, and 4 a beneficial-ownership change statement. Each classifies which regulatory disclosure form a company filed. None describes how a measurement, computation, or simulation was performed. Promoting the filing type to a measurement method would assert a category error, not a normalization."
    also_not_property_shaped: "independent of the method question: daf.extractors.edgar_daily_index's Observation.content is date_filed/filing_count/form_type_counts/filings -- a per-day filing-index summary, with no property key at all. Measured directly: assess_pool over a real EDGAR acquisition examines 0 property candidates, and no_context_free_property on the raw content returns MISSING_PROPERTY, MISSING_VALUE and MISSING_UNIT alongside MISSING_METHOD/MISSING_CONDITIONS/MISSING_UNCERTAINTY_KIND. There is no scientific assertion here for a method to qualify, so the question of whether form_type satisfies MISSING_METHOD does not arise -- MISSING_METHOD is one of six simultaneous absences, not the one gap standing between this content and admissibility."
    conditions: "EDGAR reports no measurement conditions of any kind -- no temperature, instrument, sample, or protocol. MISSING_CONDITIONS is preserved, independent of the method finding above, per its own absence of source support."
    uncertainty: "EDGAR reports no uncertainty semantics of any kind -- a regulatory filing has no error bar. MISSING_UNCERTAINTY_KIND is preserved. No value from stated/estimated/propagated/absent is assigned, because none is genuinely known; absent specifically was not chosen, since choosing it would assert that the source reported no error, and EDGAR reports no error because it is not a measurement -- a materially different fact than a measurement source that omits one."
    verdict: document_classification
    action_taken: none
    action_taken_reason: "form type is not scientific method and was not forced through the gate. No extractor, adapter, or gate was modified. The rejection the property-admissibility gate would produce if EDGAR content were ever treated as a property candidate remains exactly what Phase 29 measured -- unreachable by this route, not weakened by it."

  usgs_magnitude_type:
    field: "properties.magType, surfaced as magnitude_type in daf/extractors/usgs_earthquakes.py"
    real_values_observed:
      - "mb"
      - "ml"
    semantic_classification: legitimate_method_provenance
    classification_evidence: "mb, ml, mw, md, mww and similar USGS magnitude-type codes name the specific algorithm or scale used to compute an earthquake's magnitude from seismographic data (body-wave, local/Richter, moment, duration, W-phase moment) -- distinct methods that can and do disagree on the same event. This is categorically different from EDGAR's form_type: it describes how a scientific quantity was derived, not what kind of document was filed."
    verdict: legitimate_method_provenance
    quantity_contract: "science.admissibility.quantity_is_typed requires content['unit'] to be any truthy value; it performs no semantic or dimensional validation of what that value is. This is measured from the function's own source, not inferred from its name or docstring: `if not content.get('unit'): reasons.append(MISSING_UNIT)` is the entire check."
    unit_decision: "dimensionless -- the true physical fact about a seismic-magnitude scale, which is logarithmic and carries no physical dimension by international convention (SI recognises the symbol 1 for dimensionless quantities). Not a placeholder invented to pass the gate, and not the magnitude-type code itself: Mw is never written into unit, because a scale identifier is method provenance, not a unit of measurement -- USGS's own data model already separates the two (mag vs magType), and no source in this repository has ever used unit to mean anything other than a genuine physical unit (NOAA: m/ft; the Phase 29 accepted fixture: MPa)."
    method_decision: "the verbatim magType value (e.g. mb), carried through unmodified. USGS already separates WHICH NUMBER from HOW IT WAS COMPUTED; method needed no reinterpretation to represent that split, only a second key pointing at the same string already present as magnitude_type."
    conditions_decision: "deliberately not supplied. place/origin_time/depth_km identify WHICH EVENT this is (identity), not a measurement condition a second reading of the same quantity could vary by. status (automatic/reviewed) is revision/QC metadata -- the same category Phase 17 excluded from NOAA content (q) for the same reason: a later reviewed revision of an event must stay comparable to its own earlier automatic reading. No real conditioning field exists in this repository's USGS acquisition. MISSING_CONDITIONS is preserved on its own evidence."
    uncertainty_decision: "deliberately not supplied. No fixture or documented field in this repository's USGS acquisition carries a magnitude error or confidence value. MISSING_UNCERTAINTY_KIND is preserved; absent was not assigned, since that would assert the source explicitly reported no error rather than the true fact that no error data was available to this acquisition at all."
    action_taken: "additive extension of daf/extractors/usgs_earthquakes.py: property/value/unit/method keys added alongside every existing key, none removed or renamed"
    action_taken_reason: "method and quantity/unit are both legitimately representable by the existing contract without invention; conditions and uncertainty are not, and are preserved as genuine rejections rather than fabricated to raise the acceptance rate"
    identity_impact: "Observation.content changed, so Observation.id for USGS acquisitions differs from every prior phase. Disclosed, not concealed: no EvidencePool records are committed anywhere in this repository (architecture/invariants.yaml migration: 0), and USGS observations have always emitted entities=(), relations=(), so no existing retrieval.engine/materials.analysis comparison-context behavior (the concern that stopped a similar change to NOAA in Phase 29) exists for this source to disturb."
    real_acquisition_result:
      candidates_examined: 3
      accepted: 0
      refused: 3
      reasons:
        - MISSING_CONDITIONS
        - MISSING_UNCERTAINTY_KIND
      note: "method and unit resolved correctly and do not appear in the refusal reasons; the observation remains genuinely inadmissible for the two dimensions the source cannot supply"
