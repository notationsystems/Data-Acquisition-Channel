  scl_side: ALREADY IMPLEMENTED INDEPENDENTLY
naming: the operation is fourier_transform_1d. FFT is an implementation strategy, not the mathematical operation, and must not be the operation name.
proposal_id: 2026-08-25-daq-workload-proposal
rationale:
  - "The joint rule is: select the highest-leverage workload whose observation requirements are ALREADY satisfied by DAQ. Applying it to the two measured artifacts leaves exactly two admissible candidates and one winner."
  - "Eliminated by the rule itself, not by preference: least_squares and principal_component_analysis both require a multivariate dataset with variable identity, which the capability artifact marks ABSENT -- selecting either is forbidden. viterbi requires a categorical emission sequence, also absent. kalman_filter is only PARTIALLY satisfied (a scalar R exists per sample, but covariance-bearing uncertainty is absent) and is additionally the most expensive workload to build first, at 14 of 15 primitives missing; the measured arithmetic shows Kalman costs 1 primitive if built after the linear-algebra cluster and 14 if built first, so sequencing it early would be a 14x error. pid_controller is satisfied for pure computation, but its only distinctive value is actuation, and no actuation-authority boundary exists in any of the three repositories -- building it would create an implicit control plane."
  - That leaves fourier_transform_1d and convolution_correlation_1d, which have IDENTICAL observation requirements (values, ordering, units, provenance) and are both satisfied by the real NOAA series today. Convolution is cheaper -- 6 primitives against 11.
  - "fourier_transform_1d is selected over convolution on three measured grounds. (1) Generality falsification: the substrate has been exercised by exactly one kernel (Lennard-Jones pairwise), and a transform is orthogonal to both that kernel and to the linear-algebra family, so it tests whether the substrate generalises across computational families rather than deepening a single one; convolution shares the reduction shape of the existing kernel and would falsify less. (2) Independent validation quality: a transform admits analytic oracles that depend on no second implementation -- impulse to flat spectrum, DC concentration, pure tone to expected bins, Parseval, inverse reconstruction -- whereas convolution's natural oracle is another convolution, which the brief forbids as a sole oracle. (3) Contract generality: fourier_transform_1d forces the parameter identity model to carry input_kind, spectrum_convention, direction, normalization, precision and sample_spacing, semantics that cannot be hidden in backend defaults; convolution exercises far fewer."
  - daq_extension is none because the workload needs nothing DAQ lacks. Sample spacing is not stated by CO-OPS, and the correct consequence is a bin-index axis rather than a fabricated frequency axis -- an honest output, not a gap. Extending DAQ to carry a Delta t the source never provided would be fabrication, and extending it for any other modality would be representation work with no named consuming workload, which the joint rule forbids.
recommended_daq_extension: none
recommended_workload: fourier_transform_1d
