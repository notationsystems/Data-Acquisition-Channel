"proposal_id": "2026-08-25-daq-workload-proposal"
"rationale":
  - "REISSUED after re-measuring the compute layer at commit 5447df3. The first issue reasoned from a matrix measured at edfc2dc, three commits stale, and that matrix's central claim -- a universal gate of wire, configuration and result primitives that unblocked zero workloads and behind which everything sat -- described a substrate that no longer exists. The gate is built. See architecture/workload_primitive_matrix.yaml for the re-measure; the earlier rationale is not carried forward."
  - "The joint rule is unchanged: select the highest-leverage workload whose observation requirements DAQ already satisfies. Applied to the compute layer's OWN blocking_requirements at 5447df3, the candidates sort cleanly. fourier_transform_1d has zero blockers and is BUILT. convolution_1d has zero blockers on either side -- the compute layer states its DAQ requirement is satisfied wherever Fourier's is, because it shares the ordered-1d modality. pid_controller has zero blockers but its distinctive value is actuation, and no actuation-authority boundary exists in any repository. least_squares, pca, kalman_filter_linear and viterbi all carry unsatisfied blockers."
  - "convolution_1d is therefore the only in-scope candidate the rule admits, and DAQ's answer for it is gate A: the current representation is sufficient and no extension is required. That is what this proposal recommends, and it is a genuinely weaker recommendation than the first issue's. The transform now exists, so convolution has a second implementation strategy through the convolution theorem and adds less substrate generality than it would have before Fourier was built. It is recommended because it is what the rule admits, not because it is the most valuable thing to do."
  - "The higher-leverage path is least_squares, and DAQ cannot elect it alone. It is the only candidate whose blockers split across BOTH repositories -- two DAQ-owned (stable_sample_and_variable_identity, explicit_missing_value_semantics) and one compute-layer-owned (linear_algebra_primitive_family). That is precisely the shape the joint rule's second clause addresses: the smallest DAQ representation extension that unblocks the highest-leverage justified workload, paired with the named workload that consumes it. Electing it is a two-party act and is not done here."
  - "One prerequisite this phase did supply: kalman_filter_linear's blockers are BOTH DAQ-owned, and one of them is recursive_generation_depth -- the invariant corrected this phase from vacuously_enforced to represented_unenforced, with its semantic domain fixed to evidence lineage rather than iteration count. structured_measurement_uncertainty remains open, so Kalman is still blocked; but its blockage is now one item shorter and both remaining owners are DAQ."
"recommended_daq_extension": "none"
"recommended_workload": "convolution_1d"
"reissue":
