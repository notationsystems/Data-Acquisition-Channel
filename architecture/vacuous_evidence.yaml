# ----------------------------------------------------------------------
# TWO FURTHER CLASSES, same disposition: DAQ-local, proposed for the next
# joint reissue of proof_integrity.yaml, not written into it.
# ----------------------------------------------------------------------
a_direction_does_not_discriminate_when_the_property_also_has_a_magnitude:
  the_property: "when a check can be written against a SIGN or against a MAGNITUDE, the sign is usually the one that fails to discriminate -- because a wrong implementation often has the right sign. The natural test is the sign, and it agrees with the negation."
  the_attestations:
    the_band_broadening_kernel: "an exponential tail kernel was indexed backwards. A delta test asked whether mass moved to LATER elution volume; it did, and the test passed. A reversed exponential also moves mass later -- it TRANSLATES the peak instead of tailing it. What caught it was the magnitude: the centroid must shift by the kernel's discrete mean, r/(1-r) steps with r = exp(-step/tau), and the reversed kernel shifted six times further."
    the_earlier_one: "the counterparty records a prior instance in a PSD budget, relative versus absolute. Attributed rather than re-measured here -- DAQ has not seen that code."
  why_it_is_not_just_the_discriminating_case_rule: "the discriminating-case rule says an example drawn from the property holding agrees with the negation by default. This is narrower and more actionable: it says WHICH axis to test when a property has two. A magnitude check subsumes a sign check; a sign check almost never subsumes a magnitude one."
  the_practical_form: "if the property is `X moves in direction D by amount A`, assert A. Asserting D alone is the cheaper test and it is the one that passes on the broken implementation."

a_stated_limit_that_inverts_a_conclusion_is_not_a_conservative_one:
  the_property: "a KNOWN LIMIT is normally recorded as a reason a result might be understated -- the reader is invited to treat the finding as a lower bound. That invitation is only valid if the limit is CONSERVATIVE. A limit that changes the SIGN of a residual does not soften the conclusion; it points a correction the wrong way, and a reader told `this is conservative` will act on it."
  the_measured_instance: "the forward instrument model recorded a Gaussian broadening kernel as a limit, on the reasoning that it understates the low-M side and therefore biases the same way as truncation. Measured with an exponentially modified Gaussian: the cancellation point moved from N = 2600 with Mn error +3.4% to N = 8250 with Mn error MINUS 20.3%. Six times the magnitude AND the opposite sign, with the reported dispersity reading correct in both."
  what_makes_it_a_class_rather_than_an_incident: "the reasoning that produced the limit was right about DIRECTION -- the symmetric kernel does bias with truncation -- and wrong about CONSEQUENCE, because tailing couples to the result twice, once through the modelling bias and once through the physics, in opposite directions. No amount of reasoning about the limit would have reached that. Which makes this the sibling of the class above: the direction was knowable by argument and the magnitude was not."
  the_practical_form: "a stated limit must say whether it is conservative, and that word is a MEASUREMENT rather than an expectation. Until it is measured, the honest phrasing is `effect unknown in sign and size`, not `if anything understated`."

# ----------------------------------------------------------------------
# A SECOND MEASURED INSTANCE OF THE IDIOM, TWO COMMITS AFTER THIS RECORD
# WAS WRITTEN, AND THIS TIME THE CLAIM WAS FALSE.
# ----------------------------------------------------------------------
the_second_instance:
  what_was_claimed: "`shared set byte-identical`, in the verification block of commit ede73b1."
  was_the_claim_true: "NO. Run properly against both repositories on 2026-08-27, verify_pair_landed.py exits 1 and reports four of nineteen shared files DIFF: architecture/exchange/daq_requirement_response.{yaml,sha256} and architecture/exchange/invariant_register.{yaml,sha256}. The two artifacts that commit was actually about -- proof_integrity.yaml and kalman_validation_preregistration.yaml -- are byte-identical, which is why the false half went unnoticed."
  how_the_check_was_malformed_in_this_session: "`python architecture/exchange/verify_pair_landed.py 2>&1 | tail -12; echo PAIR_EXIT=$?`. Two independent defects, both the same family. The script takes two repository paths and was given none, so it printed its usage text and returned 2. And `$?` after a pipeline is the status of the LAST command, so it read tail's 0. The usage text scrolled past under a `tail` that showed its final lines, which read like check output."
  what_is_not_claimed_here: "how the check was run at ede73b1. That is outside this session's record and is not reconstructed. What is established is that the claim is false as measured today, and that the run in this session which should have caught it was itself malformed in the way described."
  why_it_is_a_different_failure_from_the_first_instance: "the first was a TRUE claim with vacuous evidence -- the class this record is named for. This is the ordinary discarded-exit-code failure the class was said to be worse than, producing a FALSE claim. So the record's own argument now has a companion: the same idiom, in the same phase, yielding both the subtle failure and the plain one."
  the_aggravating_detail_restated: "this record was written at ede73b1. The idiom recurred at the very next verification block. Writing the rule down did not change the behaviour, which is the counterparty's stated property holding for the fifth time this phase."
  the_repair_applied: "the script's exit status is read directly and its arguments are supplied, with output written to a file rather than piped, so that no pipeline can stand between the producing step and its status."

# ----------------------------------------------------------------------
# A THIRD CLASS, same disposition: DAQ-local, proposed for the next joint
# reissue, not written into proof_integrity.yaml.
# ----------------------------------------------------------------------
a_diff_and_a_stale_mirror_are_the_same_observation_with_different_causes:
  the_property: "a byte-comparison across two repositories reports DIFF for two situations that call for opposite responses. DIVERGENCE -- the two sides authored incompatible content -- is a joint reissue. STALENESS -- one side holds an older copy of an artifact the other owns -- is a mirror that has not been pulled, and editing either side's content would be wrong. The check reports the same word for both."
  it_is_the_mirror_of_the_class_above: "an empty diff and a verified agreement are the same observation with different causes. So are a divergence and a stale mirror. In both cases the discriminator is not in the observation and has to be fetched from somewhere else."
  the_measured_instance: "verify_pair_landed.py reports DIFF on architecture/exchange/invariant_register.yaml. Measured, the two copies differ on ONE line out of 16064 identical bytes -- artifacts_declaring_the_core, 47 on DAQ's side and 36 on the compute layer's -- and the file is DAQ-owned: its bent-zero block is derived by scanning DAQ's own phase reports, which the compute layer does not hold. Regenerating the register against the compute layer's tree counts 7, not 36. So its copy is not an independently generated census that happens to disagree; it is a stale copy of DAQ's, from before the count moved. daq_requirement_response.yaml is the same shape and further behind -- 6311 bytes against 15057, missing every least_squares and pca row DAQ has since answered."
  what_the_discriminator_actually_was: "whether the disagreeing side could have PRODUCED its own copy. It could not: it holds neither the inputs nor a generator for them. That is checkable and the check does not ask it."
  why_it_is_not_a_defect_in_the_verifier_to_be_fixed_here: "verify_pair_landed.py is itself in the shared set and byte-identical across the pair. Changing it is a joint reissue, and DAQ altering a shared checker unilaterally is the failure that checker exists to prevent. Recorded and proposed, not applied."
  what_its_own_docstring_already_says: "that byte identity is coverage for DIVERGENCE and not for CURRENCY. It is right, and the gap it names is wider than stated: the check does not merely fail to detect staleness, it REPORTS staleness in the vocabulary of divergence, which is worse than silence because it invites the wrong repair."
  the_wrong_repair_it_invites: "copying one side's number into the other to make the digests agree. That would make the census false on one side and the check green, which is the outcome the check exists to prevent."

the_aggravating_detail: "the author was quoting the standing rule about discarded exit codes in the same phase, in commit messages, while committing this. That is the fourth time this phase a class has recurred inside or beside the instrument built for it. It is consistent with the property the counterparty stated: knowing a class does not inoculate the next instance, because the instance never looks like the class while you are writing it."
