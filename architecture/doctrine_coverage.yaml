# WHAT A ZERO DOCTRINE DIFF IS EVIDENCE FOR, AND WHAT IT IS SILENT ABOUT.
#
# The standing phase discipline is that every architecture change goes
# through the doctrine generator with a verified zero regeneration diff.
# That check is real and it is narrower than it reads: doctrine.yaml
# names its sources in a LIST, and architecture/ holds more files than
# the list names. For an artifact outside the list, a zero diff is not
# evidence that nothing broke -- the generator never opened it.
#
# This is the coverage shape one level up: not in a gate, but in the
# mechanism that certifies the gates' record is current. It is filed
# because it now has a MEASURED POPULATION rather than a hypothetical
# one -- two artifacts hit it in consecutive phases, and measuring the
# rest turned up two more that are covered by nothing at all.
extends: core@1.0.0

subject: doctrine_coverage
status: measured_and_deferred
owner: daf
enforcement: tests/test_doctrine_coverage.py

# ----------------------------------------------------------------------
# MEASURED. Counts are derived by the enforcement, never restated here as
# numbers a reader would have to trust.
# ----------------------------------------------------------------------
the_measurement:
  what_was_counted: "every architecture/*.yaml, against the sources list in architecture/doctrine.yaml, against every tests/*.py that names the file."
  the_shape: "the source list is an ENUMERATION. Artifacts outside it are invisible to the doctrine projection, so `doctrine regeneration diff zero` says nothing whatever about them."
  how_it_surfaced: "twice, in consecutive phases, by an artifact being CHANGED and the zero-diff being reported as if it covered the change. polymer_acquisition_readiness.yaml was corrected and regenerated to a zero diff the generator could not have produced otherwise; chemistry_rule_ownership.yaml was added the same way. Neither is a source."
  why_that_is_not_obviously_wrong: "the excluded files are records and findings -- defect records, preregistrations, verticals, readiness accounts -- and a defect record is not doctrine. The projection covers the control loop, evidence classes, roles, invariants and unresolved items. The curation reads DELIBERATE, not drifted."

# ----------------------------------------------------------------------
# The part that is not merely a narrower-than-it-reads check.
# ----------------------------------------------------------------------
two_artifacts_are_covered_by_nothing:
  measured: "kalman_validation_preregistration.yaml and selection_rule_defect.yaml are neither doctrine sources nor named by any test. Every other artifact outside the source list is bound by at least one test that reads it."
  what_that_means: "they could be arbitrarily stale, internally contradictory, or contradicted by the tree, and the entire suite stays green. A zero doctrine diff does not reach them and no test does either."
  the_near_miss_worth_recording: "kalman_validation_preregistration.yaml IS named in architecture/exchange/verify_pair_landed.py -- inside SHARED_AS_ENUMERATED_UNTIL_2026_08_26, a dated list retained as history, which its own test deliberately declines to assert membership of because doing so would assert `the presence of a dated list, not membership of the live set`. A reference that binds nothing looks exactly like one that does."
  not_repaired_here: "binding them means re-measuring their claims against the tree, and an artifact bound by a test that asserts unverified claims is worse than one honestly marked unbound. Named as executable work rather than done in passing."

# ----------------------------------------------------------------------
# THE DEFERRAL. Same shape as the half-frozen reconstruction's, and for
# the same reason.
# ----------------------------------------------------------------------
the_deferral:
  what_is_undecided: "whether doctrine.yaml's sources should be DERIVED from architecture/ with explicit exclusions, or stay an enumeration. Both are defensible and they are different answers to what doctrine IS -- a projection of everything the architecture declares, or a projection of the subset that is doctrine rather than record."
  deferred_while: "the source list stays curated rather than drifting, and no artifact outside it is unbound beyond the two already named. Deriving the list would move the doctrine source digest and every hash reference bound to it, in both repositories -- so while the exclusions are deliberate and the unbound set is not growing, the cost of deciding wrongly exceeds the cost of waiting. The moment a THIRD artifact is neither a source nor bound by a test, the exclusions are no longer curation and the deferral lapses."
  trigger_enforced_by: "tests/test_doctrine_coverage.py::test_the_deferral_on_the_doctrine_source_list_still_holds"
  why_a_trigger_and_not_a_note: "this repository has watched two parked items fade because they were carried in prose, and the counterparty's faded the same way. A deferral with no condition attached is indistinguishable from an omission once the session that made it ends. This one states what keeps it valid and fails when that stops being true."
  not_a_decision: "recorded as UNDECIDED. Not a preference, a lean, or a plan -- either resolution may be right and neither has been chosen. It is a decision about the pair's wiring and it is not one to take mid-phase."
  what_it_does_not_defer: "the reporting rule. A zero doctrine diff must not be offered as evidence for a change to a non-source artifact; that change is bound by its own test or it is not bound at all. Phase 38 stated this about its own regeneration rather than letting the green stand unqualified."

# ----------------------------------------------------------------------
what_this_check_cannot_see:
  naming_is_not_reading: "the binding measurement asks whether any test NAMES the artifact. A test that names a file without asserting anything about its content passes. So the unbound set is a LOWER BOUND -- it catches artifacts no test mentions at all, and cannot catch one mentioned inertly. The dated list in verify_pair_landed.py is the live example of exactly that failure mode, which is why it is recorded above rather than left as a caveat."
  why_it_is_not_strengthened_here: "asserting that a test MEANINGFULLY reads an artifact is the same undecidable shape as asserting a check is not a proxy. The honest move is to state the bound rather than to claim a stronger property the check does not have."

the_shape_this_repeats: "A MECHANISM THAT CERTIFIES CURRENCY, WHOSE OWN COVERAGE IS A LIST. The same form as coverage_specified_by_enumeration in architecture/proof_integrity.yaml, one layer out: there a CHECK's predicate was a list someone wrote, here the CERTIFIER's subject is. Both work perfectly on what the author had in mind, both report a confident green, and both are repaired by deriving rather than naming. What is different is that this one is not repaired -- the repair is expensive and the exclusions look deliberate -- so it carries a trigger instead of a fix."
