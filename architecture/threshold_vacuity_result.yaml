# ----------------------------------------------------------------------
the_population: "FOUR suspect parameters in daf science boundary bridge epistemics session commerce tools assertion instrument, found by AST over fourteen name fragments. All four are instances. P1 holds."

# ----------------------------------------------------------------------
the_four_measured_at_their_edges:

  science_set_attestation_check_attestation:
    parameter: tolerance
    what_a_degenerate_value_does: "at INFINITY an attestation of 999999 against a computed 0.5762 reports AGREED. At NaN an attestation that reconciles exactly reports DISAGREED, because every comparison with NaN is false. Both verdicts are about the threshold."
    disposition: guarded
    why_not_removed: "it encodes a reader's judgement about how the source rounded its inputs, and a library that picked one would be answering a question it cannot see the evidence for. The domain is finite and non-negative; 0.0 stays legal and means exact."
    how_it_was_found: "not in this repository. Writing the standalone package's README meant explaining `tolerance` to a stranger, and the sentence about why it has no default invited the next question."

  science_replicate_pairing_covariance_rank:
    parameter: rank_tolerance
    what_a_degenerate_value_does: "MEASURED on a rank-3 matrix and a rank-1 matrix. At 1.0 and above both report rank 0 -- no pivot can exceed rank_tolerance x largest, not even the largest itself. Below 0.0 both report full rank. At infinity and NaN both report 0. In every case the answer stops depending on the matrix."
    disposition: guarded
    the_domain: "[0.0, 1.0). 0.0 is INSIDE it and is not degenerate: it keeps every strictly positive pivot, which is the exact-rank answer. Measured rather than assumed, which is why the interval is half-open."
    why_this_guard_matters_more_than_the_others: "it sits on a JOIN. rank_tolerance normally arrives from published_rank_tolerance(), which reads the compute layer's own published constant out of architecture/exchange/scl_requirements.yaml. A degenerate value published there would otherwise change every rank in this repository in silence. The guard makes the counterparty's artifact loud instead."
    what_was_not_touched: "the rule itself. `pivot > tol * largest` is the compute layer's, and using theirs is what makes the two sides agree about which directions exist. For every tolerance inside the domain the answer is bit-identical to before."

  commerce_mileage_validation_lane_is_discriminating:
    parameter: minimum_duration_delta_pct
    what_a_degenerate_value_does: "at 0.0 and below it accepts the Toronto-Montreal trunk haul that moved 0.19% between auto and truck costing -- the exact lane the predicate was written to exclude. At infinity and NaN it rejects a lane that moved 17%."
    disposition: guarded
    why_it_is_the_sharpest_of_the_four: "the others compute a wrong answer. This one SELECTS THE VALIDATION SUITE. A threshold of zero does not merely mislead a reader; it fills the suite with lanes that agree by construction, and every downstream result is then evidence about nothing."
    new_refusal_code: A_SELECTION_THRESHOLD_THAT_SELECTS_EVERYTHING

  instrument_calibration_volume_for_mass:
    parameter: tolerance
    what_a_degenerate_value_does: "at 1e6 and at infinity it returned 9.0 for a mass whose true volume is 11.0 -- the bisection loop broke after a single halving and the midpoint of the calibrated range was returned as an inversion, with no signal. An error of 2.0 volume units, silently."
    disposition: REMOVED, not guarded
    why_removed: "it encoded no judgement and no caller in the tree ever supplied it. P2's prediction: a parameter that cannot be supplied wrongly is better than one that is checked."
    what_removing_it_also_bought: "accuracy. The old default of 1e-12 returned 10.999999999999886; running the bisection to the bracket's own representable limit returns 11.0 EXACTLY, at 6.5, 11.0 and 17.5 across the calibrated range. The guard-versus-remove choice was not a wash."

# ----------------------------------------------------------------------
the_predictions:
  P1_all_four_are_instances: HELD
  P2_two_dispositions: "HELD. Three guarded, one removed, and the removal measured strictly more accurate rather than merely safer."
  P3_no_shared_helper: "HELD. The four domains are finite-and-non-negative, finite-and-in-[0,1), finite-and-strictly-positive, and none-at-all. No two are the same, so a shared validator would take the domain as an argument and be the defect's own shape."
  P4_derived_not_enumerated: "HELD. tests/test_threshold_vacuity.py re-runs the AST sweep at test time. Detector-proofed: adding an unguarded `max_drift` parameter to commerce/mileage.py fires it. NO EXCLUSION LIST -- the module states that if it ever needs one the rule is wrong."
  P5_detector_proofed: "HELD, per guard rather than in aggregate. Five defects planted, five detected: the attestation guard removed; the rank_tolerance guard removed; the lane minimum guard removed; the inversion's tolerance parameter restored; a new unguarded threshold added to the product."
  P6_nothing_valid_moves: "HELD. No existing test expectation was widened. covariance_rank at 1e-12 still gives 3 and 1; the published cutoff 1e-12 is inside the stated domain; the lane predicate at 5.0 still rejects 0.19% and accepts 17%; every anchor assertion on check_attestation is unchanged."

the_stop_condition_was_not_reached: "science/admissibility.py, both per-cell vocabularies, the vendored core and both jointly-held artifacts are untouched by this repair."

