# ----------------------------------------------------------------------
# THE PREDICTIONS. Each is falsifiable by performing the bump and running
# the suite; none is checkable now, which is what makes them worth
# recording now.
# ----------------------------------------------------------------------
predictions:

  p1_exactly_one_thing_goes_red_and_it_is_the_referent_join:
    prediction: "tests/test_core_referent.py fails on the join between architecture/core.yaml's `submodule_commit: 5e146d5` and the gitlink, and NOTHING ELSE IN THE SUITE FAILS FOR A VERSION REASON."
    basis: "MEASURED -- the pyproject at the head still declares 1.0.0, so `extends: core@1.0.0` remains true of every artifact and the census does not move."
    why_it_is_the_prediction_that_matters: "this is the silent-move condition stated in core.yaml, and the prediction is that the repository is QUIET about it except at the one join built for it. If p1 holds, the referent work did its job. If the suite goes red in several places, the protection was incidental rather than designed."
    what_would_falsify_it: "any failure attributable to the version label, or a green suite with the pin moved -- the second being far worse, since it would mean the participating referent is joined on nowhere."

  p2_the_ste_invariants_fixed_point_breaks_and_should:
    prediction: "architecture/exchange/build_ste_invariants.py re-scans the vendored tree on every generation, so at the new pin its reference index changes and the artifact is no longer a fixed point of its generator."
    basis: "MEASURED, from that generator's own record: it is HALF-FROZEN -- per-invariant verdicts hand-written and frozen, the index re-scanned -- and the divergence between the two halves is pinned as EXPECTED in tests/test_invariant_register.py."
    the_consequence_that_is_not_a_defect: "the pinned expected divergence is itself a function of the pin. Moving the pin changes what `expected` means, and a pinned expectation that survives a change in its subject would be the shape this pair files as a verdict that did not account for what it quantifies over."
    what_would_falsify_it: "an identical index at the new pin, which would mean the generator does not read what it says it reads."

  p3_the_reconstruction_is_superseded_rather_than_corrected:
    prediction: "ste_invariants.yaml is RETIRED in favour of the declaration, not merged with it. Its content is a reconstruction of what documents constrain; the declaration is the owner's statement, and the two are different KINDS of object."
    basis: "OPEN -- this is a disposition, and it is recorded as a prediction about what the right one is so that choosing differently is a visible choice."
    the_reason_it_is_not_a_merge: "the reconstruction's value was entirely that it was marked as one. Folding an owner's declaration into it produces a document that is authoritative in some fields and reconstructed in others with nothing marking which -- the half-frozen shape p2 already names as worse than either half."
    what_would_falsify_it: "the declaration turning out to be incomplete against the reconstruction -- if it leaves any of the three asks unanswered, retirement would drop content nothing replaces, and merging under explicit per-field attribution becomes the right disposition instead. Checked by reading the declaration's three blocks against ste_invariants.yaml's three, not by whether retirement feels tidier."

  p4_the_cardinality_question_is_answered_and_neither_of_our_options_was_right:
    prediction: "this repository considered eight and ten. The declaration answers NEITHER, and RETRACTS the ten rather than correcting it to eight, on the ground that eight rests on a single citation to a brief that is not in the tree."
    basis: "MEASURED at the head, in architecture/exchange/ste_invariant_declaration.yaml under `two_resolve_the_cardinality`, against this repository's architecture/exchange/ste_invariants.yaml."
    why_it_is_recorded_as_a_prediction_anyway: "because what is being predicted is not the answer -- that is read -- but that this repository ACCEPTS it. A retraction that leaves a question open is harder to adopt than a number, and the failure mode is quietly keeping eight."
    and_the_agreement_is_explicitly_not_treated_as_confirmation: "the declaration says so itself: both readings come from the same documents by the same method, so there is no independence in the agreement. It cites the same rule this repository files under convergence_is_not_evidence, reached from the other side."
    what_would_falsify_it: "this repository, after the bump, still recording a cardinality of eight or ten anywhere -- or recording the retraction as though it were a decision the two parties negotiated, when it is one party retracting its own unsupported sentence."

  p5_bent_zero_becomes_checkable_against_a_declared_set_for_the_first_time:
    prediction: "the twelve `Bent: zero` claims recorded in architecture/exchange/invariant_register.yaml stop being claims about a party with no enumeration. At the new pin the core declares its own invariant registry in the tree, so `no core invariant changed` acquires a set to quantify over."
    basis: "MEASURED -- the core's architecture/invariants.yaml at the head parses to 27 entries, and its architecture/canonical_state_invariants.yaml declares how that registry relates to the numbered set. Compared against this repository's architecture/exchange/invariant_register.yaml, which records the core as the party with no enumeration."
    what_does_not_follow: "that the twelve verdicts become retroactively better founded. They were made relative to the OLD pin, where no declaration existed, and they rest on byte-identity of the vendored tree -- which is what actually carries them. A declaration arriving later does not reach backwards."
    what_would_falsify_it: "the declared registry turning out not to be the set `Bent: zero` was ever about -- for instance if architecture/canonical_state_invariants.yaml establishes that the registry and the numbered set do not contain one another, in which case a claim quantifying over one still says nothing about the other, and the register's account would have to say which."

  p6_a_second_replicate_consumer_is_a_counterpart_and_not_a_duplicate:
    prediction: "materials/replicate_join.py and science/replicate_pairing.py are consumers of one finding on two substrates, and neither should be deleted for the other."
    basis: "MEASURED from the core module's own statement: it consumes materials.analysis.ComparisonGroup, which is in that tree and not this one, and it credits the acquisition layer with the finding and with stating the remedy."
    what_it_adds_that_this_repository_did_not_have: "a MECHANISM and a number. The unpairing is not merely absence: group values arrive ordered by content-addressed observation id, so two properties over the same runs give two unrelated permutations. Index pairing therefore does not fail -- it returns rho = +0.38 where the true value is -0.98, wrong in SIGN, stably, reproducibly. That is the answer to the polymer vertical's stated question, arriving from the other side."
    the_obligation_it_places_on_this_repository: "that module declares a dependency on TWO acquisition-side properties -- one Record per run, and the run identifier out of content -- and states that neither is enforced there. They are this layer's to enforce, and this file records that they are now load-bearing for a consumer in another repository."
    what_would_falsify_it: "finding that the two modules make incompatible claims about the same pairing, rather than compatible claims about two substrates."

# ----------------------------------------------------------------------
what_must_be_re_measured_if_the_pin_moves:
  the_rule_being_followed: "architecture/core.yaml states it -- `bent: []`, `core_invariants_modified: 0` and every `extends:` are assertions about the core AT THE PARTICIPATING REFERENT. If the commit moves, they are claims about a different object and must be re-measured, whatever the label says."
  the_list_this_produces:
    - "architecture/core.yaml submodule_commit, and the version parsed from the pyproject at the new commit."
    - "architecture/exchange/ste_invariants.yaml -- regenerated, or retired per p3."
    - "architecture/exchange/invariant_register.yaml -- it records the core's enumeration status, and that status changes."
    - "the twelve `Bent: zero` occurrences -- not rewritten, but the register's account of what they quantify over."
  and_one_thing_that_does_not_move: "every `extends: core@1.0.0`. The version is unchanged at the head, which is exactly why this bump is the dangerous kind rather than the loud kind."

