# THE PHASE 0 LEDGER. One entry per cycle, per the standing plan's step 9.
extends: core@1.0.0

subject: phase_zero_ledger
status: phase_zero_open
owner: daf
enforcement: tests/test_commerce_standing_plan.py

phase: "0 — one transaction"
entry_condition: met
exit_condition: "one real load or quote recorded end to end, by hand, with a commitment and an outcome recorded separately"
exit_met: "no"
what_blocks_it: "a person, and a real load. This is a section 4 escalation: the work requires a real-world event."

# ----------------------------------------------------------------------
# CYCLE 1
# ----------------------------------------------------------------------
cycle_1:
  orient: "pushed tree at f567034, four gates green on the previous cycle, no validWhile guard fired (10 pass), no red gate, no live wrong answer, no refusal carrying an executable remedy, miss log empty."
  select: "precedence fell to tier 6, the next item in the current phase. The current phase is 0."
  pre_registration: "expectation -- a form-file CLI with the session instrument's 2/1/0 exit codes. I would be shown wrong if any step of recording one load still required Python, or if the CLI could emit a record the stores would reject."
  the_measurement_that_chose_the_item: "walked one real transaction end to end through the tree. Steps 1 to 7 passed: the form exists, a quote and an invoice both record, the events pair, they reach the three stores, the residual computes at 150.00, and the accounting conserves. STEP 8 STOPPED -- there was no way to reach any of it without writing Python."
  what_was_built: commerce/__main__.py
  result: "one load recorded end to end from the shell. Two residuals (+150.00 CAD on the rate, +1.00 day on transit), one unsettled promise still visible with the settlement it awaits named, accounting 3 of 3, exit 0. Exit 2 for usage, an unreadable file, a missing file, a missing authority, and a known_at equal to the typing time."

  # ------------------------------------------------------------------
  # SELF-CORRECTIONS. A cycle with none is a cycle where nothing was
  # probed.
  # ------------------------------------------------------------------
  self_correction_the_class_recurred_at_the_shortest_distance:
    what_happened: "the Phase 0 blocker turned out to be the SAME defect this account named and fixed for the session instrument: a mechanism that enforces its invariants and can only be reached by writing Python. The sentence `a mechanism reachable only through an import statement is reached by nobody` is already in session/intake.py, written by me, and commerce/ was built without it anyway."
    the_doctrine_line_it_confirms: "knowing a class does not inoculate against the next instance. The instance never looks like the class while you are writing it."
    how_it_was_found: "not by reading. By walking one transaction and watching step 8 stop."

  self_correction_i_built_out_of_phase:
    what_happened: "the award adapter was built earlier in this same session, before the standing plan was committed. Phase 0's must-not is explicit: do not build integrations to avoid needing the transaction. An award adapter is an integration."
    why_it_was_not_deleted: "section 4 escalates on deleting or rewriting a verified subsystem. It is built, tested (25 tests), and green, so removing it is a person's decision rather than mine. It is recorded here as out-of-phase rather than quietly kept."
    what_was_done_instead: "the email reader written in the same stretch was REMOVED unbuilt, with a validWhile condition naming when it is re-taken. It had no tests and was not a verified subsystem, so removing it needed no escalation -- and it demonstrates the rule rather than describing it."
    the_shape: "the most effective way to erode a deliberate decision is a good idea. Both were good ideas. Both were adjacent. Neither was the phase."

  self_correction_a_dead_guard:
    what_happened: "the CLI carried `if not accounting.conserves if hasattr(accounting, 'conserves') else False:` -- a conditional expression that always evaluates False because Pairing has no `conserves` attribute. The conservation check never ran."
    why_it_matters: "it is a check that reports green by never executing, which is the vacuity class in a branch rather than a test."
    repaired: "compares accounted against the commitment count directly, and says what a promise in no bucket means."

  what_the_work_revealed_that_was_not_anticipated:
    the_form_and_the_reader_were_two_formats: "the blank form printed a single object and the reader expected an array of entries with an authority envelope. An operator would have had to reshape the output of `form` before `record` would read it. A test now asserts the loop closes: what form prints, record reads."
    the_hedge_rule_generalises_beyond_email: "it was written for an email parser and belongs to manual entry, because a person typing `about 40,000 lbs` is the same defect as a parser reading it. The rule survived the removal of the thing it was written for."

# ----------------------------------------------------------------------
# UNBUILT, recorded per the standing plan's section 7 rather than built
# because it is adjacent and good.
# ----------------------------------------------------------------------
unbuilt_ai_dispatch_as_a_vendor_wedge:
  arrived: "2026-08-31"
  status: not_built_and_not_mine_to_decide
  what_it_proposes: "Notation as a VENDOR to carriers -- operating on their dispatch data, capturing value as software -- rather than as a BROKER generating its own commitment/outcome data."
  why_it_is_an_escalation_and_not_a_task: "its own sequencing puts `answer broker or vendor` first, and that is a decision about what company this is. Section 4 escalates on anything binding the firm to a counterparty and on a declared invariant changing. This is both."
  the_conflict_it_names_correctly: "the two paths collide at the data ask. A carrier's dispatch history reveals its cost base, customer list, lane economics and capacity. A brokerage holding that is not a neutral party, and a competent operations director sees it in the first meeting. So `both` is not a middle option -- it makes the ask the whole wedge depends on much harder."
  what_would_cost_nothing_and_decide_it: "the lead-time gap, measured on a carrier's own historical data before anything is built. A dispatcher already knows Truck 184 is late because the driver called; the value is entirely in the gap between when a system could know and when the dispatcher does. If that gap is negative on most exception types the wedge is not exceptions at all, it is the downstream consequence nobody has computed yet."
  the_measurement_rule_that_already_applies: "retrospective analysis on historical dispatch data IS a backtest. Hindsight leakage is the specific danger: `we would have reassigned load 8421`, evaluated with knowledge the dispatcher did not hold at the decision moment, is a demonstration and not a finding. The as-known-then machinery in commerce/ already does this and would have to be pointed at their data rather than rebuilt."
  validWhile: "this stays unbuilt WHILE the broker-or-vendor question is unanswered by a person. It is not deferred because it is weak -- the data asymmetry is real and would dissolve the cold-start the whole standing plan is gated on. It is deferred because building it takes a position on what the firm is."

  the_one_part_that_is_a_gap_in_an_existing_rule_rather_than_a_new_dimension:
    what: "this account's collection policy prohibits person-targeting, and the policy does not distinguish EMPLOYEES from third parties."
    why_it_matters_here: "a driver-level model of the form P(success | driver, lane, customer, time) is an employee performance model driving work assignment. That is a different category from a third-party contact name, and the existing rule neither permits nor forbids it -- it simply does not address it."
    why_it_was_still_not_written_now: "it is a policy decision with employment and privacy consequences, not a code gap, and section 4 escalates rather than choosing a default. Named here so the silence is recorded rather than read as permission."
    the_technical_finding_that_survives_either_answer: "four of the six reasons in the assessment's own worked example are not about the driver at all -- they are about the receiver, the lane, the tractor and positioning. Modelling those captures most of the signal with none of the exposure, generalises across drivers, has far more observations each, and transfers to a new driver on day one. That is a better model AND the safer one, which is an unusually clean case."

next_executable_frontier:
  item: "none that is not the transaction."
  why: "precedence tier 6 returns Phase 0's exit, which requires a real load. That is a section 4 escalation: the work requires a real-world event."
  what_would_unblock_it: "one real load or one real quote, run by hand, with the quoted rate and the invoiced rate recorded as separate entries. `python3 -m commerce form` prints the form; `python3 -m commerce record <file>` grades it."
  what_was_done_instead: "the thing that made the transaction recordable at all, and nothing beyond it."
  what_must_not_be_done_while_waiting: "build integrations to avoid needing the transaction. That is Phase 0's must-not and this cycle already breached it once."
