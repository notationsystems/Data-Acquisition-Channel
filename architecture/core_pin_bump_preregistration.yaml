  the_pin_recorded_as_something_else: "replaced with a sha the gitlink does not carry. test_the_pin_has_not_moved_so_this_is_still_a_preregistration FAILED, which is the failure that will occur for real on the day of the bump and is the signal to SCORE this document rather than edit it."
  an_artifact_named_in_the_re_measurement_list_that_is_not_in_the_tree: "architecture/core.yaml renamed to a path that does not exist. test_the_re_measurement_list_is_not_empty_and_names_artifacts_that_exist FAILED."
  and_two_of_these_checks_fired_for_real_before_any_plant: "on this document's first run. p4 claimed a MEASURED basis and cited no path, and p3 named nothing that would falsify it. Both were repaired in the ARTIFACT rather than the check -- p4 now cites the declaration by path, p3 now says what would make retirement the wrong disposition. A check whose first act is to find two gaps in the document it was written for is a check that was not written to pass."

