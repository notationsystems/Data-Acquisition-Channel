status: remeasured
structural_measurements:
  byte_layer: native/include/scl/bytes.hpp provides read_double_le, write_double_le, read_int32_le
  complex_arithmetic: present -- native/src/fourier.cpp operates on std::vector<std::complex<double>>
  dispatch: a registry table in native/src/operation_registry.cpp with find_operation(name) and supported_operation_names() -- no longer the single string equality measured at edfc2dc
  operations_registered:
    - lj_pairwise_energy_forces
    - fourier_transform_1d
  outcome_shape: OperationOutcome carries raw std::vector<uint8_t> output plus named metrics, rather than the hardwired (energy, forces) pair measured at edfc2dc
  request_shape: OperationRequest carries raw std::vector<uint8_t> configuration and input; each operation validates its own layout. The 24-byte LJ-specific envelope constraint measured at edfc2dc is gone from the boundary.
  tests_collected: 204
  tests_collected_note: measured by pytest collection, which needs no native build
  transform: present -- forward and inverse, three normalizations (None, OneOverN, OneOverSqrtN)
supersedes: the matrix carried in docs/PHASE_36_SCIENTIFIC_MODALITY_AND_SCL_INTERFACE.md, which was measured against compute-layer commit edfc2dc and is three commits stale. That matrix reported 1 of 28 primitives present and every workload blocked at the protocol boundary. Both statements were true of edfc2dc and are false of the current commit.
why_no_decision_is_recorded_here: "two independent reasons, either sufficient. First, the encoding is not settled: architecture/canonicalization_defect.yaml records an open implicit-typing defect whose fix re-hashes both exchange artifacts, so any decision written now would bind digests that are about to change. Second, a joint decision is a two-party act and this session has read-only access to the compute layer. The correct order is settle the encoding, re-hash and freeze the artifacts, then write the decision where both digests can be verified against their origin repositories."
