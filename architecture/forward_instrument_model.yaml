# A SIMULATED GPC WHOSE REPORTED MOMENTS ARE KNOWABLY WRONG.
#
# Not a chromatography simulator. An ORACLE: the truth is closed form and
# the report is not equal to it, and the difference is the product. A
# clean simulator would teach nothing the analytic moments already state.
#
# STEPS 1-4 OF THE BUILD ORDER. Steps 5 and 6 -- report emission in the
# shape Phase B.1 measured, and running the extractor against emitted
# reports -- are NOT built, because B.1 has not run: this session does not
# have the corpus anchors. Emitting a report shape nobody has measured is
# the third-fixture problem the brief names in its own first paragraph.
extends: core@1.0.0

subject: forward_instrument_model
status: steps_1_to_4_built_5_and_6_blocked_on_the_anchors
owner: daf
enforcement: tests/test_forward_instrument_model.py

# ----------------------------------------------------------------------
the_layer_rule: "nothing in the product imports `instrument`, and `instrument` imports nothing from the product. A product path that can reach the forward model is ground truth leaking into the measurement; a fixture generator that depends on the code under test is not an independent oracle. Both directions asserted by AST over every authored package, derived rather than listed -- and the bent:zero package derivation picked the new package up with no change, which is what the property form is for."

# ----------------------------------------------------------------------
acceptance:
  one_analytic_equals_integrated:
    verdict: PASSES
    measured: "all three families to better than 1e-10 relative, across three decades of Mn, z from 0 to 19, and dispersity from 1.05 to 3.0."
    and_it_earned_itself_immediately: "the first run showed Flory's Mn off by 1.0e-06 while the z > 0 families agreed to 1e-14. The cause was a FIXED six-decade lower integration bound. Mn is (integral of w) over (integral of w/M), the second is the number integral, and for small M the number density goes as M^z -- so at z = 0 it is FLAT and six decades leaves 1e-6 of it outside the grid. The bound is now derived: solving (L/b)^(z+1) = epsilon gives twelve decades at z = 0. The residual error then matched the chosen epsilon, which is the derivation confirmed by measurement rather than by the pass."
    why_that_matters_beyond_the_fix: "the strongest anchor was also the case that exposed the defect, and it did so before anything downstream was built -- which is exactly what the build order's `stop here and verify` is for."
  two_flory_dispersity_is_exactly_two:
    verdict: PASSES
    measured: "2.000000000 at Mn = 1e3 through 1e7. The 3 : 2 : 1 invariant is a property of the most-probable distribution, not of this code."
  three_reported_pdi_exceeds_true_pdi:
    verdict: FALSE AS STATED, and the reason is a finding
    what_was_asked: "reported PDI > true PDI, always, and the excess grows as plate count falls. If the model does not produce a reported PDI larger than the true PDI, the broadening is wrong."
    what_was_measured: "the broadening is RIGHT and a second effect the brief did not model dominates at realistic plate counts, in the opposite direction."
    broadening_in_isolation: "holds exactly as specified. Against a wide calibration with only N varying, the excess over the unbroadened report is +0.001 at N = 300000 and +1.32 at N = 300, strictly monotonic across seven plate counts, always positive."
    the_effect_that_was_missing: "THE COLUMN'S PERMEATION LIMIT. A real calibration spans a finite mass range; the column cannot see chains below it. Truncating the low-M tail biases Mn UP and dispersity DOWN with no broadening at all -- measured at D = 1.899 against a true 2.000 on an UNBROADENED chromatogram. Widening the calibration recovers D = 1.999999, which is what identifies truncation as the cause rather than the estimator."
    so_the_acceptance_criterion_was_underspecified: "not wrong about broadening. It assumed broadening was the only error source, and a report is wrong even with a perfect column because the column cannot see the whole distribution."

  the_sharpest_result:
    what_it_is: "TWO LARGE ERRORS CANCEL INTO A CORRECT-LOOKING DISPERSITY. At N = 2500 against a realistic permeation limit, truncation and broadening balance: the report states D = 2.004, indistinguishable from a correct measurement, while Mn is wrong by +3.28%."
    why_it_matters_more_than_the_acceptance_test: "the cancellation is in the RATIO and not in the SCALE. A consumer reading a dispersity of 2.00 off a report has no way to tell a correct measurement from two large errors that happened to balance -- and the number that is still wrong is the one a formulation would be built on."
    it_was_not_predicted: "nothing in the brief anticipated it. It fell out of measuring why acceptance 3 failed."
    superseded_scope: "IT IS A PROPERTY OF ONE SLICING CONVENTION, NOT OF THE INSTRUMENT. Every number above was measured with one slice per acquisition point -- equal WIDTH in volume -- and a real Waters Empower report slices by equal AREA. Under equal-area slicing read at the slice end, there is no plate count at which the report reads D = 2.00: the reported dispersity stays above 2.09 however good the column is, and the Mn residual is NEGATIVE where equal-volume made it positive. The failure mode stands -- a consumer still cannot tell a correct dispersity from two cancelling errors -- but WHERE it happens, and whether it happens, depends on a convention the report does not carry. See `corrections` below."

  four_reproducible: 
    verdict: PASSES
    measured: "identical parameters give bit-identical moments. The magnitude is stated rather than discovered per run: Mn +5.05%, Mw +0.97%, dispersity -0.078 at N = 10000 against the narrow calibration."
  five_two_calibrations_one_truth:
    verdict: PASSES
    measured: "the same distribution through polystyrene and PMMA calibrations reports Mn differing by 1.13%. The difference is attributable to a STATED property -- standard_chemistry on the calibration object -- rather than merely observed, which is why the calibration is an object and not a function."
  six_integration_limits_change_the_report:
    verdict: PASSES, and it is the deliverable
    measured: "against one chromatogram, one column and one calibration, the analyst's integration choices alone move the reported Mn from 105048 to 170186 -- SIXTY-TWO PERCENT -- and the dispersity from 1.92 to 1.36. A 5% baseline threshold alone moves Mn by 12%."
    what_it_demonstrates: "no_context_free_property's argument executable rather than asserted. The reported values depend on information the report does not carry, on fabricated data, at zero instrument cost."
    the_parameters_are_required_arguments: "not defaults. A default that silently applies would be the omission this measures, repeated in the instrument."

# ----------------------------------------------------------------------
what_is_not_built_and_why:
  report_emission: "step 5. The brief requires the shape Phase B.1 measured, and B.1 has not run. ONE anchor now exists -- the Empower report under `corrections` -- but it was supplied as unverified machine-extracted text, no fixture has been transcribed from it, and its own Tables 1 and 2 did not extract. A report shape invented from a partial extraction would be the third fixture with an anchor cited over it, which is worse than the third fixture."
  extractor_against_emitted_reports: "step 6, which depends on step 5. It is the first time this programme could say HOW WRONG an ingested observation is rather than whether it was refused, and it waits on the anchors."
  the_truth_record: "specified in the brief as a separate artifact structurally incapable of entering the pool. Not built, because nothing emits a report yet for it to accompany. The layer rule above is the enforcement that will carry it: `instrument` is unreachable from the product, so a truth record living there cannot reach an adapter."
  a_general_rate_solver: "explicitly out of scope. The broadening width is derived from a stated plate count, which is a physical claim that can be wrong informatively; a fitted sigma would be a knob."

known_limits_of_the_model:
  uniform_broadening: "sigma_V = V_peak / sqrt(N) applied across the whole peak. A general rate model would give a width varying with retention. Stated because the acceptance criterion is about the SIGN and DEPENDENCE of the discrepancy rather than its exact magnitude, and a varying width would change the magnitude without changing either."
  gaussian_not_emg_MEASURED_AND_THE_LIMIT_WAS_UNDERSTATED: "the symmetric kernel was recorded as understating the low-M side, biasing the same way as truncation. That reading was right and the CONSEQUENCE was six-fold larger than conceding it suggested. An exponentially modified Gaussian is now built -- as the Gaussian convolved with a one-sided exponential, which is what an EMG is -- and measured: at tau/sigma = 0 the cancellation sits near N = 2600 with Mn +3.4%; at tau/sigma = 2 it sits near N = 8250 with Mn MINUS 20.3%. The report still reads a correct-looking dispersity in both. So the symmetric model does not merely understate the residual, it gets its SIGN wrong, and a consumer calibrating against it would correct Mn in the wrong direction. The cancellation finding is strengthened by its own stated limit rather than weakened."
  tailing_alone: "isolated against the wide calibration, where truncation is absent: tailing raises dispersity monotonically (2.030 to 2.123 as tau/sigma goes 0 to 2) and lowers Mn monotonically (99307 to 76236). So its effect on D opposes truncation while its MODELLING bias -- using a symmetric kernel -- runs with truncation, which is why the direction had to be measured rather than reasoned."
  a_direction_test_was_not_a_discriminating_case: "the first tail kernel was indexed backwards. A delta test showed mass moving to later volume and PASSED, because a reversed exponential also moves mass later -- it translates the peak instead of tailing it. The magnitude caught it: the centroid must shift by the kernel's discrete mean, r/(1-r) steps, and the reversed kernel shifted six times further. The sign was the natural check and it agreed with the negation."
  fabricated_calibration_coefficients: "the two calibrations are chosen to be monotonic and physically ordered over their range. They are NOT transcribed from any instrument and nothing here claims they are."

# ----------------------------------------------------------------------
# Corrections made after the record first landed. Kept as corrections
# rather than folded into the results above, because a record that
# quietly re-derives its numbers under a new assumption hides that the
# old ones were taken under a wrong one.
corrections:
  slicing_was_assumed_equal_volume_and_empower_is_equal_area:
    dated: "2026-08-27"
    source: "ANCHOR 1 -- a Waters Empower contract-lab GPC report published through EPA ChemView (TSCA P-22-0051), supplied to this session as extracted text. NOT held in this tree: no fixture has been transcribed, the extraction is machine-produced and has NOT been verified field-by-field against the rendered PDF, and its Tables 1 and 2 did not extract. What is used here is the STRUCTURE of its slice table, which is legible in the extracted text and does not depend on any single transcribed digit."
    what_the_anchor_shows: "one hundred slices; a `Slice Area` column reading the same value on every row; a `Cumulative %` column running 1 to 100; and elution steps that narrow through the peak (16.078, 16.178, 16.250, 16.307) and widen in the tails (23.978, 25.667). That is equal-area slicing. This module assumed equal-volume."
    why_it_was_invisible: "`slicing` was a default. The estimator formula was right and the definition of a slice was wrong, and a default is how a wrong definition survives every test written against the thing it defines. Both `slicing` and `EqualAreaSlicing.representative` are now required arguments, for the same reason `IntegrationParameters` already was."
    what_it_does_not_change: "the equal-volume numbers are reproducible bit-for-bit under `EqualVolumeSlicing()` and none of them moved. Equal-volume is a real convention -- fixed-interval integration -- so those results are convention-stamped rather than withdrawn."
    what_it_changes: "AT N = 10000 AGAINST THE NARROW CALIBRATION, WITH EVERYTHING ELSE HELD: equal-volume reports Mn +5.05%, equal-area at the slice midpoint +6.16%, equal-area at the slice end MINUS 6.84%. The slicing convention alone flips the sign of the Mn residual. And there is no plate count at which the endpoint rule reports a correct-looking dispersity: the minimum over plate counts from 500 to 1e8 is 2.094."
    the_mechanism_rather_than_the_observation: "Mn is a harmonic mean and equal-area slices are widest in the tails. The final slice holds one percent of the area and, read at its end, sits at the column's permeation limit -- so it carries more than a sixth of the sum that sets Mn. One row in a hundred."
    the_representative_point_is_not_pinned_by_the_anchor: "a cumulative column running 1 to 100 indicates the reported volume is each slice's END, and the endpoint rule reads every slice at its low-mass edge. A midpoint rule does not. The two differ by more than eleven percent of the true Mn on the same chromatogram. The anchor does not settle it, so it is an argument and not a constant here."
    two_omissions_that_interact: "integrated to the calibration's own edges the three conventions spread Mn across twelve points and disagree on its sign; under a tight analyst window (8 to 16 mL) they agree to three points and on the sign. The integration limits are the analyst's and absent from the report; the slicing convention is the vendor's and also absent. How much the second omission matters cannot be bounded without the first."
    what_would_settle_it: "the anchor's own Tables 1 and 2. If the report's printed Mn and Mw equal the equal-area sums over its own printed one hundred (area, MW) rows, the estimator reads the printed slice masses and the representative question is answered by the artifact. That check is available the moment those tables are recovered from the rendered PDF, and it is a prediction rather than a result: it has not been run."
    the_convergence_check_that_makes_this_discretisation_and_not_a_second_defect: "equal area is a change of variable, not a different integral, so the two conventions must agree in the limit. Measured: 1.1e-02 relative on Mn at one hundred slices, 3.0e-04 at one thousand, 3.4e-05 at ten thousand. The disagreement at the real slice count is therefore attributable to the count, not to a new bug."

known_limits_added_by_this_correction:
  the_anchor_is_not_in_the_tree: "no fixture has been transcribed and B.1 has not run. Nothing above depends on a transcribed value; it depends on the slice table's shape. A numerical claim about the anchor's own moments waits on the rendered PDF."
  the_representative_point: "stated above. Unresolved by the artifact, and it moves Mn by eleven points."
  equal_area_over_a_split_peak: "refused rather than approximated. A running area total across a baseline gap attributes the missing area to the slice that spans it, so `EqualAreaSlicing` raises on a non-contiguous admitted region. Equal-volume has no running total and still computes, which is why the check lives on the convention that needs it."
