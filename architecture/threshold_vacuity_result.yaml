  which_side_moved: "the counterparty's. Measured by diff: TWELVE lines added on their side and ZERO removed on ours, 78399 bytes against 81739. kalman_validation_preregistration.yaml is byte-identical. So this is the staleness case, not the divergence case -- the distinction architecture/vacuous_evidence.yaml files as `a_diff_and_a_stale_mirror_are_the_same_observation_with_different_causes`, here resolved by asking which side could have produced its own copy."
  what_they_added: "a class instance, `a_fixed_oracle_read_against_a_sample_that_moves`: a test that compares a measurement to a fixed bound while the SAMPLE moves between processes. It names tests/test_replicate_pairing.py drawing 4000 runs with `seed=hash(str(rho)) % 100000`."
  the_defect_was_live_in_THIS_tree: "yes, at tests/test_replicate_pairing.py:164, unrepaired. Four consecutive interpreters here gave hash(str(0.0)) % 100000 = 67649, 38988, 88201, 36619 while the bound abs=0.05 did not move."
  the_record_was_verified_before_it_was_acted_on: "the pinned seed 20260903 gives deviations 0.015385, 0.016152, 0.004384, 0.001511, 0.000288 across the five parametrisations -- worst 0.016152, margin 3.10x. The counterparty's record states `worst 0.01615 ... a margin of 3.1x`. Reproduced to five significant figures without having read that line first, which is what establishes that the record is about this code and not about a copy of it."
  the_seed_was_not_shopped: "20260903 is the value their record prescribes and the first one tried here. Best-of-N selection would tune the experiment to its own answer. The tolerance was not touched."
  the_binding_check: "tests/test_no_test_draws_from_a_process_varying_seed.py, by sweep over every module under tests/. A hash() may be ASKED ABOUT -- read by an assert or standing alone -- and may not be CARRIED FORWARD into data. Measured on this tree: 62 legitimate hashability probes allowed, ONE site flagged, no exception list. Detector-proofed by replanting the original line."
  why_the_two_classes_are_siblings: "both leave the mechanism intact and destroy the discrimination from outside it. Theirs moves the SAMPLE under a fixed bound; this one moves the BOUND under a fixed sample. Neither is findable by confirming the check ran, and both produce a well-formed verdict the whole time."

